/* ============================================================
   RUNWAY ENGINE — Key SKU simulation (contracted vs. spot shipments,
   gap/stockout projection, rent-free deadline tracking)

   Only items with keySku === true are ever touched by this. Everything
   else on Stock just uses par vs. stock, same as before — no change.
   ============================================================ */
function daysFromToday(dateStr) {
  if (!dateStr) return null;
  const d0 = new Date(todayStr() + 'T00:00:00');
  const d1 = new Date(dateStr + 'T00:00:00');
  return Math.round((d1 - d0) / 86400000);
}

// ---- Core simulation ------------------------------------------------------
// Batch-level model. Each shipment is tracked as its own batch so we always
// know how much of THAT batch is left on any given day — pooling them together
// made rent exposure wrong (an in-transit batch inflated a landed batch's
// figure). Consumption is drawn from batches earliest-rent-deadline first,
// matching the drawdown rule used when orders are sent.
//
// Consumption per day, in priority order:
//   1. A pending order scheduled that day  -> use its ACTUAL quantity.
//   2. Day is within the ordering horizon (state.orderDate) with no order
//      -> consume 0. Ordering for that day is done; nothing was ordered.
//   3. Otherwise -> forecast using the average burn rate.
// This stops the average burn being applied to days we already have real
// answers for (user formula: D = P + (S−A)/R).

// Pending (not yet picked up) drawdowns hitting a given shipment.
function pendingDrawdownForShipment(shipmentId) {
  return state.orders.reduce((sum, o) => {
    if (!isStillIncoming(o) || !o.drawdowns) return sum;
    return sum + o.drawdowns
      .filter((d) => d.shipmentId === shipmentId)
      .reduce((s2, d) => s2 + (Number(d.qty) || 0), 0);
  }, 0);
}

// What's physically still in the warehouse for a shipment: its remaining
// balance, plus anything a pending order has claimed but not yet collected.
function physicalRemaining(s) {
  return shipmentRemaining(s) + pendingDrawdownForShipment(s.id);
}

// Horizon: five months. Long enough to see a contract loading in Sept arrive
// in Nov and be consumed into Dec; short enough that the coverage bar stays
// readable on a phone. This is all numbers/dates now — no curve — so the
// horizon is chosen for usefulness, not for what fits on a chart.
const SIM_DAYS = 150;

// Turn a day-offset into a date string.
function dayToDateStr(day) {
  const d = new Date();
  d.setDate(d.getDate() + day);
  return toLocalDateStr(d);
}

// Near-term dates are stated precisely; anything further out is deliberately
// rough ("~mid-Nov"), because a burn-rate projection months ahead is an
// estimate and shouldn't pretend otherwise.
function roughDateLabel(day) {
  if (day == null) return '—';
  const d = new Date();
  d.setDate(d.getDate() + day);
  if (day <= 14) return formatDateLabel(toLocalDateStr(d));
  const dom = d.getDate();
  const part = dom <= 10 ? 'early' : dom <= 20 ? 'mid' : 'late';
  const mon = d.toLocaleDateString(undefined, { month: 'short' });
  const yr = d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : '';
  return `~${part} ${mon}${yr}`;
}

function simulateItemRunway(item, shipments, days = SIM_DAYS) {
  const floor = parForDate(item, new Date());
  const burn = effectiveBurn(item);
  const itemShipments = shipments.filter((s) => s.itemId === item.id);
  const itemShipmentIds = new Set(itemShipments.map((s) => s.id));
  const horizonDay = Math.max(0, daysFromToday(state.orderDate || todayStr()));

  // Known pickups: qty drawn from THIS item's shipments, by day.
  const scheduled = {};
  state.orders.forEach((o) => {
    if (!isStillIncoming(o) || !o.drawdowns || !o.drawdowns.length) return;
    const qty = o.drawdowns
      .filter((d) => itemShipmentIds.has(d.shipmentId))
      .reduce((sum, d) => sum + (Number(d.qty) || 0), 0);
    if (qty <= 0) return;
    const day = Math.max(0, Math.min(daysFromToday(o.expectedDate || todayStr()), days));
    scheduled[day] = (scheduled[day] || 0) + qty;
  });

  // Build batches. Only shipments marked Landed count as in the warehouse
  // today (day 0). Anything not marked Landed is in transit, whatever its ETA
  // says — the ETA may simply not have been updated. A not-landed shipment
  // whose ETA is today or already past is treated as arriving tomorrow, so it
  // never inflates today's "At warehouse" figure.
  const batches = itemShipments.map((s) => ({
    id: s.id,
    shipment: s,
    arriveDay: s.received ? 0 : Math.max(1, daysFromToday(s.etaDate) ?? 1),
    overdue: !s.received && (daysFromToday(s.etaDate) ?? 1) <= 0,
    qty: physicalRemaining(s),
    deadline: s.rentFreeDeadline || '9999-99-99', // no deadline = drawn last
    perDay: [], // own remaining, by day
  })).filter((b) => b.qty > 0 && b.arriveDay <= days);

  // "Other stock" (the manual box) — loose stock with no shipment or deadline.
  const otherQty = Number(item.stockAvailable) || 0;
  if (otherQty > 0) {
    batches.push({ id: '__other', shipment: null, arriveDay: 0, qty: otherQty, deadline: '9999-99-99', perDay: [] });
  }

  const drawOrder = [...batches].sort((a, b) => a.deadline.localeCompare(b.deadline));
  const rows = [];
  const restockDays = [];

  for (let day = 0; day <= days; day++) {
    if (day > 0 && batches.some((b) => b.arriveDay === day)) restockDays.push(day);

    // Balance = everything that has arrived and isn't used up.
    const balance = batches.reduce((sum, b) => sum + (b.arriveDay <= day ? b.qty : 0), 0);
    // In transit = booked stock that hasn't landed yet as of this day.
    const inTransit = batches.reduce((sum, b) => sum + (b.arriveDay > day ? b.qty : 0), 0);
    rows.push({ day, balance, inTransit, total: balance + inTransit });
    batches.forEach((b) => { b.perDay[day] = b.arriveDay <= day ? b.qty : 0; });

    if (day >= days) break;

    // Consume: actual if known, 0 if ordering for that day is done, else forecast.
    let consume;
    if (scheduled[day] != null) consume = scheduled[day];
    else if (day <= horizonDay) consume = 0;
    else consume = burn;

    let left = consume;
    for (const b of drawOrder) {
      if (left <= 0) break;
      if (b.arriveDay > day) continue; // not here yet — can't take from it
      const take = Math.min(b.qty, left);
      b.qty -= take;
      left -= take;
    }
  }

  return { rows, restockDays, floor, batches, horizonDay };
}

// Ranges (inclusive day spans) where balance is at/below zero — real stockouts.
function stockoutRanges(rows) {
  const ranges = [];
  let start = null;
  rows.forEach((r) => {
    if (r.balance <= 0 && start === null) start = r.day;
    if (r.balance > 0 && start !== null) { ranges.push([start, r.day - 1]); start = null; }
  });
  if (start !== null) ranges.push([start, rows[rows.length - 1].day]);
  return ranges;
}

// Rent exposure: how much of THIS batch will still be sitting in the warehouse
// when its own rent-free deadline hits. Read from that batch's own depletion
// curve, so other shipments can't inflate or mask it.
//
// This deliberately includes batches still IN TRANSIT: a contract landing in
// Nov whose rent-free window closes in Dec can absolutely outstay it, and
// that's precisely the "am I burning too slow / did I book too much" warning
// worth having while there's still time to act. What matters is whether the
// batch has arrived by its OWN deadline day, not whether it's landed today.
// (The coverage bar already worked this way — the text used to disagree.)
function rentExposuresForItem(item, shipments, sim) {
  const lastDay = sim.rows.length ? sim.rows[sim.rows.length - 1].day : 0;
  return sim.batches
    .filter((b) => b.shipment && b.shipment.rentFreeDeadline)
    .map((b) => {
      const rawDay = daysFromToday(b.shipment.rentFreeDeadline);
      if (rawDay == null) return null;
      if (rawDay > lastDay) return null;      // deadline past the forecast window — can't see it
      if (rawDay < b.arriveDay) return null;  // deadline before it even lands — nothing sitting there yet
      const day = Math.max(0, rawDay);
      const qtyAtDeadline = b.perDay[day] || 0; // this batch's own remaining
      if (qtyAtDeadline <= 0) return null;      // burns down in time — no exposure
      // "Paying rent now" only if it's actually here AND the date has passed.
      const past = rawDay <= 0 && b.arriveDay <= 0;
      return { shipment: b.shipment, day, qtyAtDeadline, past };
    })
    .filter(Boolean);
}

function keySkuStatus(item) {
  const sim = simulateItemRunway(item, state.shipments);
  const { rows, floor } = sim;
  const outages = stockoutRanges(rows);
  // Only gaps opening soon are alarming — a gap 8 months out is just business.
  const nearOutages = outages.filter(([s]) => s <= ALERT_WINDOW_DAYS);
  const rentExposures = rentExposuresForItem(item, state.shipments, sim);
  const belowFloorDays = rows.filter((r) => r.balance > 0 && r.balance < floor).length;
  const base = { sim, outages, nearOutages, rentExposures, floor };
  if (nearOutages.length) return { ...base, level: 'stockout' };
  if (rentExposures.length) return { ...base, level: 'rent' };
  if (belowFloorDays > 0) return { ...base, level: 'gap' };
  return { ...base, level: 'ok' };
}

// For the timeline: when each batch lands and when it's projected to run out.
// emptyDay = first day at/after arrival where this batch's own balance is zero.
function batchLifecycle(sim) {
  const lastDay = sim.rows.length ? sim.rows[sim.rows.length - 1].day : 0;
  return sim.batches.map((b) => {
    let emptyDay = null;
    for (let d = b.arriveDay; d <= lastDay; d++) {
      if ((b.perDay[d] || 0) <= 0) { emptyDay = d; break; }
    }
    return { ...b, emptyDay };
  });
}

// A gap 300 days out is normal business, not an alarm. Only gaps opening
// within this window raise an alert — everything else is still drawn on the
// coverage bar, just not shouted about.
const ALERT_WINDOW_DAYS = 60;

// Classify every day as covered / rent-accruing / empty, then merge into runs
// so the coverage bar draws a handful of rects instead of 365.
function coverageSegments(sim) {
  const lastDay = sim.rows.length ? sim.rows[sim.rows.length - 1].day : 0;
  const stateOf = (day) => {
    const row = sim.rows[day];
    if (!row || row.balance <= 0) return 'gap';
    // Rent accrues on a batch that has landed, is past its rent-free date,
    // and still has stock sitting in it.
    const renting = sim.batches.some((b) => {
      if (!b.shipment || !b.shipment.rentFreeDeadline) return false;
      const dl = daysFromToday(b.shipment.rentFreeDeadline);
      return b.arriveDay <= day && dl != null && dl <= day && (b.perDay[day] || 0) > 0;
    });
    return renting ? 'rent' : 'covered';
  };
  const segs = [];
  let start = 0;
  let cur = stateOf(0);
  for (let day = 1; day <= lastDay; day++) {
    const s = stateOf(day);
    if (s !== cur) { segs.push({ state: cur, from: start, to: day - 1 }); start = day; cur = s; }
  }
  segs.push({ state: cur, from: start, to: lastDay });
  return segs;
}

const COVERAGE_COLORS = { covered: 'var(--forest)', rent: 'var(--amber-strong)', gap: '#C0503A' };

// Horizontal coverage bar — no Y axis, just "am I covered on this date".
// All bars share the same 12-month scale, so gaps line up vertically across
// items and you can spot four SKUs going dry the same month at a glance.
function renderCoverageBar(sim, opts = {}) {
  const { height = 12, showMonths = false } = opts;
  const lastDay = sim.rows.length ? sim.rows[sim.rows.length - 1].day : 0;
  if (!lastDay) return '';
  const w = 300;
  const h = height + (showMonths ? 12 : 0);
  const x = (d) => (d / lastDay) * w;

  const rects = coverageSegments(sim).map((s) =>
    `<rect x="${x(s.from).toFixed(1)}" y="0" width="${Math.max(0.7, x(s.to + 1) - x(s.from)).toFixed(1)}" height="${height}" fill="${COVERAGE_COLORS[s.state]}" opacity="${s.state === 'covered' ? 0.85 : 1}"/>`
  ).join('');

  // Month boundaries as faint ticks; labelled when asked.
  const ticks = [];
  const today = new Date();
  for (let mo = 1; mo <= 6; mo++) {
    const d = new Date(today.getFullYear(), today.getMonth() + mo, 1);
    const day = Math.round((d - new Date(todayStr() + 'T00:00:00')) / 86400000);
    if (day < 0 || day > lastDay) continue;
    ticks.push(`<line x1="${x(day).toFixed(1)}" y1="0" x2="${x(day).toFixed(1)}" y2="${height}" stroke="#fff" stroke-width="0.8" opacity="0.55"/>`);
    if (showMonths) {
      ticks.push(`<text x="${x(day).toFixed(1)}" y="${height + 9}" font-size="8" fill="var(--faint)" text-anchor="middle">${d.toLocaleDateString(undefined, { month: 'short' })}</text>`);
    }
  }

  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:${h}px;display:block;border-radius:3px;overflow:visible;">
    ${rects}${ticks.join('')}
  </svg>`;
}

// Which calendar months (YYYY-MM) each risk lands in, for the Runway filters.
// Built from the same coverage segments the bar draws, so filter and bar can
// never disagree.
function riskMonths(sim) {
  const out = { gap: new Set(), rent: new Set() };
  coverageSegments(sim).forEach((seg) => {
    if (seg.state === 'covered') return;
    const key = seg.state === 'gap' ? 'gap' : 'rent';
    for (let d = seg.from; d <= seg.to; d++) {
      const dt = new Date();
      dt.setDate(dt.getDate() + d);
      out[key].add(`${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}`);
    }
  });
  return out;
}

// The next 6 months as {key, label} for the month filter.
function upcomingMonths(n = 6) {
  const list = [];
  const now = new Date();
  for (let i = 0; i < n; i++) {
    const d = new Date(now.getFullYear(), now.getMonth() + i, 1);
    list.push({
      key: `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`,
      label: d.toLocaleDateString(undefined, { month: 'short', year: '2-digit' }),
    });
  }
  return list;
}

const RUNWAY_LEVEL_META = {
  stockout: { label: 'Stockout', bg: 'var(--red-bg)', text: 'var(--red-text)' },
  rent: { label: 'Rent risk', bg: 'var(--amber-bg)', text: 'var(--amber-text)' },
  gap: { label: 'Below floor', bg: 'var(--amber-bg)', text: 'var(--amber-strong)' },
  ok: { label: 'OK', bg: 'var(--green)', text: 'var(--forest)' },
};

/* ============================================================
   RUNWAY TAB — only Key SKUs (active items with keySku === true) show up here
   ============================================================ */
function renderRunwayTab() {
  const keyItems = state.items.filter((i) => i.keySku && !i.inactive);
  if (keyItems.length === 0) {
    return renderEmptyState('No Key SKUs yet', 'Open a stock item and tick "Track as Key SKU" to start watching its contracts and rent deadlines here.');
  }
  const levelOrder = { stockout: 0, rent: 1, gap: 2, ok: 3 };
  const allRows = keyItems.map((item) => ({ item, status: keySkuStatus(item) }))
    .sort((a, b) => levelOrder[a.status.level] - levelOrder[b.status.level]);

  // Risk + month filters. An item shows if it has the selected risk type, and
  // (when a month is picked) that risk actually lands in that month.
  const rowsData = allRows.filter(({ status }) => {
    if (state.runwayRisk === 'all' && state.runwayMonth === 'all') return true;
    const months = riskMonths(status.sim);
    const wanted = state.runwayRisk === 'all' ? ['gap', 'rent'] : [state.runwayRisk];
    return wanted.some((k) => {
      if (months[k].size === 0) return false;
      return state.runwayMonth === 'all' || months[k].has(state.runwayMonth);
    });
  });

  const filtersActive = state.runwayRisk !== 'all' || state.runwayMonth !== 'all';

  const filterBar = `
    <div class="row wrap gap2 mb2" style="align-items:center;">
      <select id="runwayMonth" style="width:auto;padding:6px 10px;font-size:13px;">
        <option value="all" ${state.runwayMonth === 'all' ? 'selected' : ''}>Any month</option>
        ${upcomingMonths(6).map((m) => `<option value="${m.key}" ${state.runwayMonth === m.key ? 'selected' : ''}>${m.label}</option>`).join('')}
      </select>
      ${filtersActive ? `<button data-runway-clear-filters class="btn-sm" style="background:var(--tint);color:var(--muted);">Clear</button>` : ''}
    </div>`;

  const rows = rowsData.map(({ item, status }) => {
    const meta = RUNWAY_LEVEL_META[status.level];
    const unitStr = item.unit ? ' ' + escapeHtml(item.unit) : '';
    let detail = '';
    if (status.level === 'stockout') {
      const [s] = status.nearOutages[0];
      detail = `Runs out ${roughDateLabel(s)} — spot buy or book stock`;
    } else if (status.level === 'rent') {
      const worst = Math.max(...status.rentExposures.map((x) => x.qtyAtDeadline));
      const anyPast = status.rentExposures.some((x) => x.past);
      detail = anyPast
        ? `~${worst}${unitStr} paying rent now — move out or burn down`
        : `~${worst}${unitStr} still here when rent-free ends`;
    } else if (status.level === 'gap') {
      detail = 'Dips below safety floor';
    } else {
      const [s] = status.outages[0] || [];
      detail = s != null ? `Covered until ${roughDateLabel(s)}` : 'Covered — no gaps or rent risk';
    }
    const supplier = state.suppliers.find((s) => s.id === item.supplierId);
    const wac = weightedAvgCost(item);
    return `
      <button data-open-runway-detail="${item.id}" data-runway-row
        data-name="${escapeHtml((item.name || '').toLowerCase())}"
        data-code="${escapeHtml((item.itemCode || '').toLowerCase())}"
        data-supplier="${escapeHtml((supplier ? supplier.name : '').toLowerCase())}"
        class="card" style="text-align:left;width:100%;padding:12px;">
        <div class="row" style="gap:10px;">
          <div class="flex1" style="min-width:0;">
            <div class="text-sm truncate" style="font-weight:500;color:var(--ink);">${escapeHtml(item.name)}</div>
            <div class="text-xs truncate muted">${detail}</div>
          </div>
          <div class="shrink0" style="text-align:right;">
            <span class="tag" style="background:${meta.bg};color:${meta.text};font-weight:600;">${meta.label}</span>
            ${wac ? `<div class="font-mono" style="font-size:11px;font-weight:600;color:var(--forest);margin-top:3px;">avg ${fmtMoney(wac.avg)}</div>` : ''}
          </div>
        </div>
        <div style="margin-top:9px;">${renderCoverageBar(status.sim, { height: 11 })}</div>
      </button>`;
  }).join('');

  // One shared month ruler under the stack — every bar uses the same 12-month
  // scale, so a gap in August sits at the same x-position on every row.
  const scaleSim = rowsData.length ? rowsData[0].status.sim : null;

  return `
    <div>
      ${filterBar}
      <div class="row wrap" style="gap:12px;margin-bottom:10px;">
        <span class="text-xs row" style="gap:4px;align-items:center;"><span style="width:10px;height:10px;border-radius:2px;background:var(--forest);opacity:.85;display:inline-block;"></span> Covered</span>
        <span class="text-xs row" style="gap:4px;align-items:center;"><span style="width:10px;height:10px;border-radius:2px;background:var(--amber-strong);display:inline-block;"></span> Rent accruing</span>
        <span class="text-xs row" style="gap:4px;align-items:center;"><span style="width:10px;height:10px;border-radius:2px;background:#C0503A;display:inline-block;"></span> No stock</span>
      </div>
      ${rowsData.length === 0
        ? `<p class="text-sm muted" style="padding:20px 0;text-align:center;">No Key SKUs with that risk in that month.</p>`
        : `<div style="display:flex;flex-direction:column;gap:8px;">${rows}</div>`}
      <p id="runwayNoMatches" class="text-sm muted hidden" style="padding:16px 0;text-align:center;">No Key SKUs match that search.</p>
      ${scaleSim ? `<div style="margin-top:2px;padding:0 12px;">${renderCoverageBar(scaleSim, { height: 0, showMonths: true })}</div>` : ''}
      <p class="text-xs faint" style="margin-top:10px;">Bars span the next 5 months on a shared scale — a gap in August sits in the same place on every row. Tap an item for the dated breakdown.</p>
    </div>`;
}

// Fast show/hide filter (same approach as the Stock tab) — no re-render, so it
// stays responsive even with the coverage bars drawn.
function filterRunwayRows() {
  const q = state.runwaySearch.trim().toLowerCase();
  let anyVisible = false;
  document.querySelectorAll('[data-runway-row]').forEach((el) => {
    const match = !q || el.dataset.name.includes(q) || el.dataset.code.includes(q) || el.dataset.supplier.includes(q);
    el.classList.toggle('hidden', !match);
    if (match) anyVisible = true;
  });
  const noMatches = document.getElementById('runwayNoMatches');
  if (noMatches) noMatches.classList.toggle('hidden', anyVisible || !q);
}

/* ---- Runway detail: a dated timeline, not a chart.
   Contracts can be booked months out (loading Sept, arriving Nov, consumed
   into Dec), which a squashed 45-day curve on a phone could never show. Dates
   and sentences handle any horizon and answer the only two questions that
   matter: when do I run dry (and must I spot-buy), and will this batch outstay
   its rent-free window. ---- */
function renderRunwayDetailModal(m) {
  const item = state.items.find((i) => i.id === m.itemId);
  if (!item) return modalShell('Item not found', '<p class="text-sm muted">This item may have been deleted.</p>');

  const sim = simulateItemRunway(item, state.shipments);
  const { rows } = sim;
  const outages = stockoutRanges(rows);
  const rentExposures = rentExposuresForItem(item, state.shipments, sim);
  const lifecycle = batchLifecycle(sim);
  const burn = effectiveBurn(item);
  const autoBurn = autoBurnRate(item.id);
  const usingAuto = !!(autoBurn && autoBurn > 0);
  const bw = burnWindow();
  const unitStr = item.unit ? ' ' + escapeHtml(item.unit) : '';

  const atWarehouse = rows.length ? rows[0].balance : 0;
  const inTransitNow = rows.length ? (rows[0].inTransit || 0) : 0;
  const lastDay = rows.length ? rows[rows.length - 1].day : 0;
  const firstOut = outages.length ? outages[0][0] : null;
  const nearOutages = outages.filter(([s]) => s <= ALERT_WINDOW_DAYS);

  const burnLabel = burn ? `${Math.round(burn * 10) / 10}/day` : 'not set';
  const runsOutLabel = !burn ? 'set a burn rate' : firstOut != null ? roughDateLabel(firstOut) : 'past 5 months';

  /* --- Headline: the one-line answer --- */
  let headline;
  if (!burn) {
    headline = `<div class="text-sm">Add a daily burn rate (or send some orders) to project this item.</div>`;
  } else if (firstOut == null) {
    headline = `<div class="text-sm">Covered for the next 5 months at ${burnLabel}.</div>`;
  } else {
    headline = `<div class="text-sm">Stock runs out <strong>${roughDateLabel(firstOut)}</strong> at ${burnLabel}.</div>`;
  }

  /* --- Gaps: stretches with nothing to sell. The spot-buy prompt. --- */
  const gapAlerts = nearOutages.map(([s, e]) => {
    const openEnded = e >= lastDay;
    const span = e - s + 1;
    return `
      <div class="row" style="gap:8px;align-items:flex-start;background:var(--red-bg);border-radius:8px;padding:10px 12px;">
        ${icon('alert', 16, 'var(--red-text)')}
        <span class="text-sm">${openEnded
          ? `<strong>Nothing booked after ${roughDateLabel(s)}</strong> — no shipment covers the rest of the year. Spot buy, or book a contract.`
          : `<strong>Gap: ${roughDateLabel(s)} → ${roughDateLabel(e)}</strong> (~${span} day${span === 1 ? '' : 's'} with no stock) — spot buy needed to bridge it.`}</span>
      </div>`;
  }).join('');

  /* --- Rent: burning too slow, money starts leaking. --- */
  const rentAlerts = rentExposures.map((x) => `
    <div class="row" style="gap:8px;align-items:flex-start;background:var(--amber-bg);border-radius:8px;padding:10px 12px;">
      ${icon('clock', 16, 'var(--amber-strong)')}
      <span class="text-sm">${x.past
        ? `<strong>~${x.qtyAtDeadline}${unitStr} paying rent now</strong> — rent-free ended ${formatDateLabel(x.shipment.rentFreeDeadline)}. Move it out or burn it down.`
        : `<strong>~${x.qtyAtDeadline}${unitStr} still here when rent-free ends</strong> (${roughDateLabel(x.day)}) — ${escapeHtml(x.shipment.header || 'this batch')} won't burn down in time.`}</span>
    </div>`).join('');

  const alerts = (gapAlerts + rentAlerts) || `<p class="text-sm muted">No gaps in the next ${ALERT_WINDOW_DAYS} days, no rent risk. The bar above shows all 5 months.</p>`;

  /* --- The timeline: each batch as a dated entry --- */
  const timeline = lifecycle
    .filter((b) => b.shipment)
    .sort((a, b) => a.arriveDay - b.arriveDay)
    .map((b) => {
      const s = b.shipment;
      const supplier = state.suppliers.find((sup) => sup.id === s.supplierId);
      const landed = s.received;
      const lastsUntil = b.emptyDay != null ? roughDateLabel(b.emptyDay) : 'past 5 months';
      const rentEx = rentExposures.find((x) => x.shipment.id === s.id);
      // Only claim "clears in time" when we've actually checked it. A deadline
      // past the 5-month window can't be verified, so say so rather than tick it.
      const rentDeadlineDay = s.rentFreeDeadline ? daysFromToday(s.rentFreeDeadline) : null;
      const beyondView = rentDeadlineDay != null && rentDeadlineDay > lastDay;
      let rentLine = '';
      if (s.rentFreeDeadline) {
        if (rentEx) {
          rentLine = `Rent-free until ${formatDateLabel(s.rentFreeDeadline)} — <span style="color:var(--amber-strong);font-weight:600;">~${rentEx.qtyAtDeadline}${unitStr} still here by then</span>`;
        } else if (beyondView) {
          rentLine = `Rent-free until ${formatDateLabel(s.rentFreeDeadline)} — <span class="faint">beyond the 5-month view</span>`;
        } else {
          rentLine = `Rent-free until ${formatDateLabel(s.rentFreeDeadline)} — clears in time ✓`;
        }
      }

      return `
      <div class="card" style="padding:12px;">
        <div class="row" style="gap:8px;">
          <button data-edit-shipment="${s.id}" class="flex1" style="text-align:left;min-width:0;">
            <div class="text-sm truncate" style="font-weight:600;">${s.header ? escapeHtml(s.header) : (supplier ? escapeHtml(supplier.name) : 'Shipment')}</div>
            <div class="text-xs muted truncate">${physicalRemaining(s)}${unitStr} left of ${s.quantity}${s.askingPrice ? ` · $${s.askingPrice}` : ''}${supplier && s.header ? ' · ' + escapeHtml(supplier.name) : ''}</div>
          </button>
          <button data-toggle-received="${s.id}" class="btn-sm shrink0" style="background:${landed ? 'var(--green)' : 'var(--tint)'};color:${landed ? 'var(--forest)' : '#3B7EA1'};">${landed ? 'Landed' : 'In transit'}</button>
        </div>
        <div class="text-xs" style="margin-top:8px;line-height:1.7;color:var(--muted);">
          ${landed
            ? `In the warehouse now · lasts until <strong style="color:var(--ink);">${lastsUntil}</strong>`
            : b.overdue
              ? `<span style="color:var(--amber-strong);font-weight:600;">Not marked landed yet</span> — ETA was ${s.etaDate ? formatDateLabel(s.etaDate) : 'not set'}. Tap “In transit” once it's in the warehouse · lasts until <strong style="color:var(--ink);">${lastsUntil}</strong>`
              : `Arrives <strong style="color:var(--ink);">${roughDateLabel(b.arriveDay)}</strong> · lasts until <strong style="color:var(--ink);">${lastsUntil}</strong>`}
          ${rentLine ? `<br>${rentLine}` : ''}
          ${s.notes ? `<br><span class="faint">${escapeHtml(s.notes)}</span>` : ''}
        </div>
      </div>`;
    }).join('');

  const finished = state.shipments.filter((s) => s.itemId === item.id && shipmentRemaining(s) <= 0);
  const finishedRows = finished.map((s) => `
    <div class="card row" style="padding:10px 12px;opacity:.5;gap:8px;">
      <button data-edit-shipment="${s.id}" class="flex1" style="text-align:left;min-width:0;">
        <div class="text-sm truncate">${s.header ? escapeHtml(s.header) : 'Shipment'} · ${s.quantity}${unitStr} <span class="tag">Finished</span></div>
      </button>
    </div>`).join('');

  const body = `
    <div class="row wrap gap2 mb2" style="align-items:flex-end;">
      <div>
        <div class="text-xs muted mb1">Other stock</div>
        <input type="number" inputmode="decimal" data-stock-available-for="${item.id}" value="${item.stockAvailable ?? 0}" class="font-mono"
          style="width:66px;padding:6px 8px;border-radius:8px;border:1.5px solid var(--forest);background:#F2F7F5;color:var(--forest);font-weight:700;font-size:15px;">
      </div>
      <div>
        <div class="text-xs muted mb1">${usingAuto ? 'Manual (backup)' : 'Burn /day'}</div>
        <input type="number" inputmode="decimal" data-daily-burn-for="${item.id}" value="${item.dailyBurn ?? 0}" class="font-mono"
          style="width:62px;padding:6px 8px;border-radius:8px;border:1.5px solid var(--forest);background:#F2F7F5;color:var(--forest);font-weight:700;font-size:15px;${usingAuto ? 'opacity:.55;' : ''}">
      </div>
      <div><div class="text-xs muted">Avg /day${bw ? ` (${bw.days}d)` : ''}</div><div class="font-mono text-sm" style="font-weight:700;${usingAuto ? 'color:var(--forest);' : ''}">${usingAuto ? Math.round(autoBurn * 10) / 10 : (bw ? '0 — using manual' : `need ${MIN_HISTORY_DAYS}d history`)}</div></div>
      <div><div class="text-xs muted">At warehouse</div><div class="font-mono text-sm" style="font-weight:700;">${atWarehouse}</div></div>
      ${(() => { const w = weightedAvgCost(item); return `<div><div class="text-xs muted">Avg cost</div><div class="font-mono text-sm" style="font-weight:700;color:var(--forest);">${w ? fmtMoney(w.avg) : '—'}</div></div>`; })()}
      ${inTransitNow > 0 ? `<div><div class="text-xs muted">In transit</div><div class="font-mono text-sm" style="font-weight:700;color:#3B7EA1;">${inTransitNow}</div></div>` : ''}
      <div><div class="text-xs muted">Runs out</div><div class="text-sm" style="font-weight:700;">${runsOutLabel}</div></div>
    </div>

    <div class="card" style="padding:12px;margin-bottom:14px;background:var(--tint);">${headline}</div>

    <div style="margin-bottom:4px;">${renderCoverageBar(sim, { height: 16, showMonths: true })}</div>
    <div class="row wrap" style="gap:12px;margin-bottom:16px;">
      <span class="text-xs row" style="gap:4px;align-items:center;"><span style="width:9px;height:9px;border-radius:2px;background:var(--forest);opacity:.85;display:inline-block;"></span> Covered</span>
      <span class="text-xs row" style="gap:4px;align-items:center;"><span style="width:9px;height:9px;border-radius:2px;background:var(--amber-strong);display:inline-block;"></span> Rent accruing</span>
      <span class="text-xs row" style="gap:4px;align-items:center;"><span style="width:9px;height:9px;border-radius:2px;background:#C0503A;display:inline-block;"></span> No stock</span>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:18px;">${alerts}</div>

    <div class="section-label">Shipments</div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:10px;">${timeline || '<p class="text-sm muted">No shipments logged yet.</p>'}</div>
    ${finishedRows ? `<div style="display:flex;flex-direction:column;gap:6px;margin-bottom:10px;">${finishedRows}</div>` : ''}
    <button data-add-shipment="${item.id}" class="btn btn-soft" style="display:flex;align-items:center;gap:6px;">${icon('plus', 16, 'var(--forest)')} Add shipment</button>
    <p class="hint" style="margin-top:10px;">Dates further than two weeks out are rough on purpose — they come from an average burn rate, so treating them as exact would be false precision.</p>`;

  return modalShell(item.name, body);
}

/* ---- Shipment form (add/edit) — reached only from a Key SKU's detail view ---- */
function openShipmentModal(mode, shipment, itemId, returnTo) {
  const item = state.items.find((i) => i.id === itemId);
  const draft = shipment ? {
    itemId: shipment.itemId, header: shipment.header || '',
    supplierId: shipment.supplierId || (item ? item.supplierId : '') || '',
    askingPrice: shipment.askingPrice ?? '',
    quantity: shipment.quantity ?? 0, etaDate: shipment.etaDate || '',
    rentFreeDeadline: shipment.rentFreeDeadline || '', received: !!shipment.received,
    notes: shipment.notes || '', drawnDown: shipment.drawnDown ?? 0,
    rfAuto: defaultRentFreeDeadline(shipment.etaDate || ''),
  } : {
    itemId, header: '', supplierId: (item ? item.supplierId : '') || '', askingPrice: '',
    quantity: 0, etaDate: '', rentFreeDeadline: '', received: false, notes: '', drawnDown: 0,
    rfAuto: '',
  };
  openModal({ type: 'shipment', mode, data: shipment, draft, returnTo });
}

function renderShipmentForm(m) {
  const shipment = m.mode === 'edit' ? m.data : null;
  const d = m.draft;
  const item = state.items.find((i) => i.id === d.itemId);
  const canSave = Number(d.quantity) > 0;

  const body = `
    ${item ? `<p class="text-xs faint mb2">${escapeHtml(item.name)}</p>` : ''}
    ${fieldHtml('Header (optional)', `<input type="text" id="f_header" value="${escapeHtml(d.header)}" placeholder="e.g. Mataboi 6月到">`)}
    <p class="hint">A short label to help you recognize this batch at a glance — whatever's useful to you.</p>
    ${fieldHtml('Supplier', `<select id="f_supplierId">
        <option value="">Not set</option>
        ${sortedSuppliers().map((s) => `<option value="${s.id}" ${s.id === d.supplierId ? 'selected' : ''}>${escapeHtml(s.name)}</option>`).join('')}
      </select>`)}
    <div class="row gap2">
      <div class="flex1">${fieldHtml('Quantity', `<input type="number" inputmode="decimal" id="f_quantity" value="${d.quantity}">`)}</div>
      <div class="flex1">${fieldHtml('Asking price (optional)', `<input type="number" inputmode="decimal" id="f_askingPrice" value="${d.askingPrice}">`)}</div>
    </div>
    ${fieldHtml('Expected arrival (ETA)', `<input type="date" id="f_etaDate" value="${d.etaDate}">`)}
    ${fieldHtml('Rent-free deadline', `<input type="date" id="f_rentFreeDeadline" value="${d.rentFreeDeadline}">`)}
    <p class="hint">Fills in automatically as one month after the ETA, minus a day. Change it if this batch's terms are different — once you've changed it, a later ETA change won't overwrite it.</p>
    <label class="row" style="gap:8px;margin-bottom:12px;cursor:pointer;">
      <input type="checkbox" id="f_received" ${d.received ? 'checked' : ''}>
      <span class="text-sm">Already landed / in warehouse</span>
    </label>
    <p class="hint" style="margin-top:-8px;">In transit: counts toward the runway from its ETA date. Landed: counts as available now, and its rent-free deadline starts being watched.</p>
    ${shipment ? fieldHtml('Drawn down so far (auto)', `<input type="number" inputmode="decimal" id="f_drawnDown" value="${d.drawnDown}">`) : ''}
    ${shipment ? (() => {
      const claimed = pendingDrawdownForShipment(shipment.id);
      return `<p class="hint" style="margin-top:-8px;">Updated automatically as you send, revise, or undo orders to this supplier. Only change it by hand to correct a discrepancy.${
        claimed > 0
          ? ` <strong>${claimed} of this figure is from pending orders not yet collected</strong> — if you undo one of those, that amount comes back automatically, so don't subtract it here as well.`
          : ''}</p>`;
    })() : ''}
    ${fieldHtml('Notes (optional)', `<textarea id="f_notes" rows="3" placeholder="Anything else worth remembering about this batch">${escapeHtml(d.notes)}</textarea>`)}
    ${!canSave ? '<p class="warn-hint">Enter a quantity to save.</p>' : ''}
    <div class="row gap2 mt2">
      <button data-close-modal class="btn" style="background:var(--tint);color:var(--muted);width:auto;padding:10px 16px;">Cancel</button>
      <button data-save-shipment class="btn btn-primary flex1" ${!canSave ? 'disabled' : ''}>Save</button>
      ${shipment ? `<button data-delete-shipment="${shipment.id}" class="btn" style="background:var(--red-bg);color:var(--red-text);width:auto;padding:10px 16px;">${icon('trash', 16, 'var(--red-text)')}</button>` : ''}
    </div>`;

  return modalShell(shipment ? 'Edit shipment' : 'Add shipment', body);
}

function saveShipment(data) {
  if (data.id) {
    // Merge for the same reason as saveItem — keeps fields the form doesn't
    // carry (e.g. receivedDate). finishedAt is passed explicitly as null by
    // the caller when the batch still has stock, so a stale flag can't linger.
    updateShipments(state.shipments.map((s) => (s.id === data.id ? { ...s, ...data } : s)));
  } else {
    updateShipments([...state.shipments, { ...data, id: uid() }]);
  }
  closeModal();
}
function deleteShipment(id) {
  updateShipments(state.shipments.filter((s) => s.id !== id));
  closeModal();
}

/* ============================================================
   DRAWDOWN ENGINE — links the Orders flow to Key SKU shipments.

   When an order is SENT: for each line whose item is a Key SKU, the qty is
   deducted from that supplier's LANDED shipments of that item (earliest
   rent-free deadline first — matches how cold stores release stock and
   minimizes rent). What was deducted is recorded on the order itself, so
   UNDO can re-credit exactly. Revisions adjust the same batches (see
   reviseOrderItems). The "drawn down" field on the shipment edit form is the
   manual escape hatch for correcting a discrepancy.
   ============================================================ */
/* Default rent-free deadline: one month after the ETA, minus a day
   (ETA 15 Oct -> 14 Nov). If next month is shorter (ETA 31 Jan), the
   anniversary is clamped to that month's last day first (28/29 Feb), then
   minus a day. Only a starting value — it can always be changed. */
function defaultRentFreeDeadline(etaDate) {
  if (!etaDate) return '';
  const [y, m, d] = etaDate.split('-').map(Number);
  if (!y || !m || !d) return '';
  const lastDayNextMonth = new Date(y, m + 1, 0).getDate(); // m is 1-based, so (y, m+1, 0) = last day of next month
  const anniversary = new Date(y, m, Math.min(d, lastDayNextMonth));
  anniversary.setDate(anniversary.getDate() - 1);
  return toLocalDateStr(anniversary);
}

function shipmentRemaining(s) {
  return Math.max(0, (Number(s.quantity) || 0) - (Number(s.drawnDown) || 0));
}

/* What's drawable for an item right now, for the Orders tab line.
   Deliberately narrow so the number is unambiguous:
   - LANDED only. In-transit stock can't be collected, so it isn't offered.
   - ONE batch — the one an order placed now would actually hit first
     (earliest rent-free deadline, same rule as applyDrawdownsForOrder).
   - Already net of pending orders, since shipmentRemaining subtracts their
     drawdowns — so it's what's genuinely still claimable, not gross stock.
   Markers flag what's behind it: alpha = another batch from the same
   supplier, beta = a different supplier also holds drawable stock. */
function drawdownAvailability(item) {
  if (!item || !item.keySku) return null; // only Key SKUs draw down
  const landed = state.shipments.filter(
    (s) => s.itemId === item.id && s.received && shipmentRemaining(s) > 0
  );
  if (landed.length === 0) return null;

  const byDeadline = (a, b) =>
    (a.rentFreeDeadline || '9999-99-99').localeCompare(b.rentFreeDeadline || '9999-99-99');
  const own = landed.filter((s) => s.supplierId === item.supplierId).sort(byDeadline);
  const others = landed.filter((s) => s.supplierId !== item.supplierId);

  return {
    qty: own.length ? shipmentRemaining(own[0]) : 0,
    deadline: own.length ? (own[0].rentFreeDeadline || '') : '', // rent-free date of that same batch
    alpha: own.length > 1,      // another batch from this supplier
    beta: others.length > 0,    // another supplier holds stock too
  };
}

/* Omega: no landed stock from ANY supplier, but something is on the way
   (a shipment not yet marked Landed, with quantity left). Key SKUs only. */
function hasInTransit(item) {
  if (!item || !item.keySku) return false;
  return state.shipments.some((s) => s.itemId === item.id && !s.received && shipmentRemaining(s) > 0);
}

/* ============================================================
   COSTS — all prices are per the item's own unit.
   - Weighted average: landed batches that still have stock in the
     warehouse (incl. goods claimed by orders not yet collected), weighted by
     how much of each is left. Batches without an asking price are skipped.
     In-transit batches never count.
   - Latest cost: the most recent price typed on a cart line and sent.
   ============================================================ */
function fmtMoney(n) {
  const r = Math.round((Number(n) || 0) * 100) / 100;
  return '$' + r.toLocaleString('en-US', { maximumFractionDigits: 2 });
}

/* Storage rent: +$0.50 per unit for every month (or part of a month) a batch
   has sat past its rent-free deadline. 1 day over = 1 month; exactly one
   month over = 1 month; one month and a day = 2 months. */
const RENT_PER_MONTH = 0.5;
function monthsOverRentFree(deadline, today = todayStr()) {
  if (!deadline || today <= deadline) return 0;
  const [y, m, d] = deadline.split('-').map(Number);
  let n = 0;
  let mark = deadline;
  while (mark < today && n < 600) {
    n += 1;
    const last = new Date(y, m - 1 + n + 1, 0).getDate(); // last day of that month
    mark = toLocalDateStr(new Date(y, m - 1 + n, Math.min(d, last)));
  }
  return n;
}
function batchCost(s) {
  const base = Number(s.askingPrice);
  if (!(base > 0)) return null;
  const months = monthsOverRentFree(s.rentFreeDeadline);
  return { base, months, rent: months * RENT_PER_MONTH, total: base + months * RENT_PER_MONTH };
}

// Only what's genuinely still unclaimed in the warehouse counts: quantity
// already drawn down by orders (collected or not) is left out.
function weightedAvgCost(item) {
  if (!item) return null;
  let qty = 0, total = 0;
  state.shipments.forEach((s) => {
    if (s.itemId !== item.id || !s.received) return;
    const c = batchCost(s);
    if (!c) return;
    const q = shipmentRemaining(s);
    if (!(q > 0)) return;
    qty += q; total += q * c.total;
  });
  return qty > 0 ? { avg: total / qty, qty } : null;
}

// Every sent order line with a price for this item, newest first.
function orderPurchasesForItem(itemId) {
  const rows = [];
  state.orders.forEach((o) => {
    (o.items || []).forEach((l) => {
      if (l.itemId === itemId && Number(l.price) > 0) {
        rows.push({ date: o.expectedDate || (o.placedAt || '').slice(0, 10), placedAt: o.placedAt || '', supplierName: o.supplierName || '', qty: l.qty, price: Number(l.price) });
      }
    });
  });
  return rows.sort((a, b) => b.placedAt.localeCompare(a.placedAt));
}

// Latest cart price for the item. Falls back to the copy kept on the item,
// so it survives old orders being cleared out after 90 days.
function latestCost(item) {
  if (!item) return null;
  const rows = orderPurchasesForItem(item.id);
  const q = item.quote && Number(item.quote.price) > 0 ? item.quote : null;
  if (q && (!rows.length || (q.at || '') > (rows[0].placedAt || ''))) return { price: Number(q.price), date: q.date || '', quote: true };
  if (rows.length) return { price: rows[0].price, date: rows[0].date };
  if (item.lastCost && Number(item.lastCost.price) > 0) return { price: Number(item.lastCost.price), date: item.lastCost.date || '' };
  return null;
}

// Orders tab: average if there's landed stock with a price, otherwise latest.
function displayCost(item) {
  const lq = latestCost(item);
  if (lq && lq.quote) return { price: lq.price, kind: 'quote' };
  const w = weightedAvgCost(item);
  if (w) return { price: w.avg, kind: 'avg' };
  const l = latestCost(item);
  if (l) return { price: l.price, kind: 'last' };
  return null;
}

// Purchase details popup (Edit item): sent orders with a price + landed
// batches still in stock, newest first, max 10 lines.
function purchaseDetailsForItem(item) {
  const rows = orderPurchasesForItem(item.id).map((r) => ({
    date: r.date, sortKey: r.placedAt || r.date, source: r.supplierName, qty: r.qty, price: r.price, kind: 'order',
  }));
  state.shipments.forEach((s) => {
    if (s.itemId !== item.id || !s.received) return;
    const q = shipmentRemaining(s);
    if (!(q > 0)) return;
    const sup = state.suppliers.find((x) => x.id === s.supplierId);
    const c = batchCost(s);
    const date = s.receivedDate || s.etaDate || '';
    rows.push({
      date, sortKey: date, source: s.header || (sup ? sup.name : 'Shipment'),
      qty: q, price: c ? c.total : null, rentMonths: c ? c.months : 0, kind: 'stock',
    });
  });
  return rows.sort((a, b) => (b.sortKey || '').localeCompare(a.sortKey || '')).slice(0, 10);
}

function shortDate(dateStr) {
  if (!dateStr) return '—';
  const [, mm, dd] = dateStr.split('-');
  return `${Number(dd)}/${Number(mm)}`;
}

/* SPILLS ACROSS THE SAME SUPPLIER'S BATCHES. An order draws from the batch
   with the earliest rent-free deadline first; if that batch can't cover it
   (e.g. order 5, batch has 3 left), the rest comes from the next landed batch
   of the SAME item from the SAME supplier, and so on. Only what none of that
   supplier's landed batches can cover is a spot purchase.
   Every batch touched is recorded on the order (in draw order), so Undo
   credits each one back exactly and Revise can give back LIFO.
   Quantities are aggregated per item first, so split cart lines behave the
   same as one line. */
/* Shared by new orders and revisions: take `toDraw` from `batches` in the
   order given, mutating their drawnDown. Returns what was taken per batch and
   how much nobody could cover. */
function drawFromBatches(batches, toDraw) {
  const taken = [];
  let left = toDraw;
  for (const b of batches) {
    if (left <= 0) break;
    const take = Math.min(shipmentRemaining(b), left);
    if (take <= 0) continue;
    b.drawnDown = (Number(b.drawnDown) || 0) + take;
    if (shipmentRemaining(b) <= 0 && !b.finishedAt) b.finishedAt = todayStr();
    taken.push({ shipmentId: b.id, qty: take });
    left -= take;
  }
  return { taken, left };
}

function applyDrawdownsForOrder(order) {
  const drawdowns = []; // { shipmentId, qty }
  let shipments = state.shipments.map((s) => ({ ...s }));

  // Aggregate this order's lines per item (cart lines deliberately don't merge).
  const wanted = new Map();
  order.items.forEach((line) => {
    const qty = Number(line.qty) || 0;
    if (qty > 0) wanted.set(line.itemId, (wanted.get(line.itemId) || 0) + qty);
  });

  wanted.forEach((toDraw, itemId) => {
    const item = state.items.find((i) => i.id === itemId);
    if (!item || !item.keySku) return;
    const batches = shipments
      .filter((s) => s.itemId === item.id && s.received && s.supplierId === order.supplierId && shipmentRemaining(s) > 0)
      .sort((a, b) => (a.rentFreeDeadline || '9999-99-99').localeCompare(b.rentFreeDeadline || '9999-99-99'));
    drawdowns.push(...drawFromBatches(batches, toDraw).taken);
    // Whatever's left after every batch from this supplier is a spot purchase.
  });

  if (drawdowns.length) updateShipments(shipments);
  return drawdowns;
}

function revertDrawdownsForOrder(order) {
  if (!order.drawdowns || !order.drawdowns.length) return;
  updateShipments(state.shipments.map((s) => {
    const credit = order.drawdowns
      .filter((d) => d.shipmentId === s.id)
      .reduce((sum, d) => sum + (Number(d.qty) || 0), 0);
    if (!credit) return s;
    const next = { ...s, drawnDown: Math.max(0, (Number(s.drawnDown) || 0) - credit) };
    if (shipmentRemaining(next) > 0) delete next.finishedAt;
    return next;
  }));
}

/* ---- Auto burn rate: average daily order quantity over the last 60 days.
   Divides by the days of history actually present (from the first order the
   app has on record, capped at 60) — not a fixed 60 — so a young history
   doesn't understate burn. Orders from suppliers ticked "Internal supplier"
   are skipped. Needs at least MIN_HISTORY_DAYS of history,
   otherwise returns null and the manual figure is used. ---- */
const BURN_WINDOW_DAYS = 60;
const MIN_HISTORY_DAYS = 14;
function orderDateStr(o) {
  return o.expectedDate || (o.placedAt ? toLocalDateStr(new Date(o.placedAt)) : '');
}
function burnWindow() {
  const today = todayStr();
  let earliest = '';
  state.orders.forEach((o) => {
    const d = orderDateStr(o);
    if (d && d <= today && (!earliest || d < earliest)) earliest = d;
  });
  if (!earliest) return null;
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - (BURN_WINDOW_DAYS - 1));
  const cutoffStr = toLocalDateStr(cutoff);
  const start = earliest > cutoffStr ? earliest : cutoffStr;
  const days = -daysFromToday(start) + 1; // inclusive of today
  if (days < MIN_HISTORY_DAYS) return null;
  return { start, end: today, days };
}
function autoBurnRate(itemId) {
  const win = burnWindow();
  if (!win) return null;
  const excluded = new Set(state.suppliers.filter((s) => s.isInternalSupplier).map((s) => s.id));
  const total = state.orders.reduce((sum, o) => {
    const d = orderDateStr(o);
    if (!d || d < win.start || d > win.end) return sum;
    if (excluded.has(o.supplierId)) return sum; // internal supplier: not real usage
    return sum + (o.items || [])
      .filter((l) => l.itemId === itemId)
      .reduce((s, l) => s + (Number(l.qty) || 0), 0);
  }, 0);
  return total / win.days;
}

/* ---- Suggested order quantity (Orders tab).
   Average quantity per trading day over the last 60 days, shop only:
   - lines marked (W) for your own warehouse are left out
   - orders from "Internal supplier" suppliers are left out
   - a trading day = a day you sent at least one counted order, so closed
     days (Sundays, holidays) don't drag the average down
   Then minus what's already ordered or in the cart (non-W) for the order
   date. Needs MIN_HISTORY_DAYS of history, same as the burn rate. ---- */
function computeSuggestionBase() {
  const win = burnWindow();
  if (!win) return null;
  const excluded = new Set(state.suppliers.filter((s) => s.isInternalSupplier).map((s) => s.id));
  const tradingDays = new Set();
  const totals = {};
  state.orders.forEach((o) => {
    const d = orderDateStr(o);
    if (!d || d < win.start || d > win.end) return;
    if (excluded.has(o.supplierId)) return;
    let counted = false;
    (o.items || []).forEach((l) => {
      if (l.toOwnWarehouse) return;
      const q = Number(l.qty) || 0;
      if (q <= 0) return;
      totals[l.itemId] = (totals[l.itemId] || 0) + q;
      counted = true;
    });
    if (counted) tradingDays.add(d);
  });
  if (tradingDays.size === 0) return null;
  const cartShop = {};
  state.cart.forEach((c) => {
    if (c.toOwnWarehouse) return;
    cartShop[c.itemId] = (cartShop[c.itemId] || 0) + (Number(c.qty) || 0);
  });
  return { totals, tradingDays: tradingDays.size, cartShop };
}
function suggestedQty(base, itemId, alreadyOrdered) {
  if (!base || !base.totals[itemId]) return null;
  const avg = base.totals[itemId] / base.tradingDays;
  const need = avg - (alreadyOrdered || 0) - (base.cartShop[itemId] || 0);
  if (need < 0.5) return null;
  return { qty: Math.max(1, Math.round(need)), avg };
}

/* ---- Burn rate.
   Uses the auto 60-day average when there's enough history and the item was
   actually ordered in that window; otherwise falls back to the manual
   "Burn /day" figure on the item. ---- */
function effectiveBurn(item) {
  const auto = autoBurnRate(item.id);
  if (auto && auto > 0) return auto;
  return Number(item.dailyBurn) || 0;
}

/* ---- Data pruning: keeps localStorage lean so the app stays fast for years.
   Orders older than 90 days are removed (burn calc only needs 60); finished
   shipments are hidden immediately and fully deleted 7 days after finishing.
   Long-term history lives in your JSON backups, not on the phone. ---- */
const ORDER_RETENTION_DAYS = 90;
const FINISHED_SHIPMENT_RETENTION_DAYS = 7;
function pruneOldData() {
  const orderCutoff = new Date();
  orderCutoff.setDate(orderCutoff.getDate() - ORDER_RETENTION_DAYS);
  const orderCutoffStr = toLocalDateStr(orderCutoff);
  const keptOrders = state.orders.filter((o) => {
    const d = o.expectedDate || (o.placedAt ? toLocalDateStr(new Date(o.placedAt)) : todayStr());
    return d >= orderCutoffStr;
  });
  if (keptOrders.length !== state.orders.length) updateOrders(keptOrders);

  // Shipment ids still owed to a PENDING order (sent but not yet arrived).
  // Deleting one of these would leave that order's Undo/Revise with nothing
  // to credit back to — silently corrupting the drawdown ledger. A batch
  // fully drawn by an order today can easily sit "finished" for longer than
  // 7 days if that order's pickup date is more than a week out, which is
  // routine for this business, so this guard matters in practice.
  const owedTo = new Set();
  keptOrders.forEach((o) => {
    if (isStillIncoming(o) && o.drawdowns) o.drawdowns.forEach((d) => owedTo.add(d.shipmentId));
  });

  const shipCutoff = new Date();
  shipCutoff.setDate(shipCutoff.getDate() - FINISHED_SHIPMENT_RETENTION_DAYS);
  const shipCutoffStr = toLocalDateStr(shipCutoff);
  const keptShipments = state.shipments.filter((s) =>
    !s.finishedAt || s.finishedAt >= shipCutoffStr || owedTo.has(s.id));
  if (keptShipments.length !== state.shipments.length) updateShipments(keptShipments);

  // Orphaned cart lines: a leftover unsent line whose item was deleted before
  // this cleanup existed. Invisible in the cart list (grouping requires a
  // real item), yet still counted in the pickup-locations summary — showing
  // a "Not set" with no line to find or fix. Clears itself out here.
  const keptCart = state.cart.filter((c) => state.items.some((i) => i.id === c.itemId));
  if (keptCart.length !== state.cart.length) updateCart(keptCart);
}


/* ============================================================
   SUPPLIERS TAB (+ collapsible Warehouses subsection, driver messages)
   ============================================================ */
function renderSuppliersTab() {
  const ordersForDate = state.orders.filter((o) => isStillIncoming(o) && (o.expectedDate || todayStr()) === state.orderDate);

  const supplierRows = [...state.suppliers]
    .sort((a, b) => (a.name || '').localeCompare(b.name || '', undefined, { sensitivity: 'base', numeric: true }))
    .map((s) => {
    const count = state.items.filter((i) => i.supplierId === s.id).length;
    const defaultWarehouse = state.warehouses.find((w) => w.id === s.defaultWarehouseId);
    const orderedQty = ordersForDate.filter((o) => o.supplierId === s.id).flatMap((o) => o.items).reduce((sum, l) => sum + l.qty, 0);
    return `
      <button data-edit-supplier-modal="${s.id}" class="card" style="display:block;text-align:left;width:100%;height:100%;min-width:0;padding:10px;margin:0;vertical-align:top;">
        <div class="text-sm truncate" style="font-weight:500;color:var(--ink);">${escapeHtml(s.name)}</div>
        <div class="text-xs muted truncate">${count} item${count === 1 ? '' : 's'} · ${escapeHtml(defaultWarehouse ? defaultWarehouse.name : 'varies')}</div>
        <div class="text-xs truncate" style="color:${orderedQty > 0 ? 'var(--amber-strong)' : 'var(--faint)'};">${orderedQty} ordered</div>
      </button>`;
  }).join('');

  const warehouseRows = state.warehouses.map((w) => {
    const qty = ordersForDate.flatMap((o) => o.items).filter((l) => l.pickupWarehouseId === w.id).reduce((sum, l) => sum + l.qty, 0);
    const checked = state.selectedWarehousesForDriverMsg.includes(w.id);
    return `
      <div class="card row" style="gap:8px;min-width:0;padding:10px;height:100%;margin:0;">
        <input type="checkbox" data-select-warehouse="${w.id}" ${checked ? 'checked' : ''} style="width:18px;height:18px;flex-shrink:0;">
        <button data-edit-warehouse-modal="${w.id}" class="flex1" style="text-align:left;min-width:0;">
          <div class="text-sm truncate" style="font-weight:500;color:var(--ink);">${escapeHtml(w.name)}</div>
          <div class="text-xs truncate" style="color:${qty > 0 ? 'var(--amber-strong)' : 'var(--faint)'};">${qty} to pick up</div>
        </button>
      </div>`;
  }).join('');

  const unassignedQty = ordersForDate.flatMap((o) => o.items)
    .filter((l) => !l.pickupWarehouseId || !state.warehouses.some((w) => w.id === l.pickupWarehouseId))
    .reduce((sum, l) => sum + l.qty, 0);

  return `
    <div>
      <input type="file" id="importFileInput" accept="application/json,.json" style="display:none;">

      <button data-toggle-suppliers class="row-between" style="width:100%;margin-bottom:8px;">
        <span class="section-label" style="margin-bottom:0;">Suppliers (${state.suppliers.length})</span>
        ${icon(state.showSuppliers ? 'chevronUp' : 'chevronDown', 16, 'var(--faint)')}
      </button>

/* ============================================================
   MODAL SYSTEM
   ============================================================ */
function openModal(modal) {
  state.modal = modal;
  renderModal();
}
function closeModal() {
  const returnTo = state.modal && state.modal.returnTo;
  state.modal = null;
  if (returnTo) { openModal(returnTo); return; }
  document.getElementById('modalRoot').innerHTML = '';
  renderTab(); // underlying data likely changed
}
function renderModal() {
  const root = document.getElementById('modalRoot');
  if (!state.modal) { root.innerHTML = ''; return; }
  const m = state.modal;
  if (m.type === 'item') root.innerHTML = renderItemForm(m);
  else if (m.type === 'supplier') root.innerHTML = renderSupplierForm(m);
  else if (m.type === 'warehouse') root.innerHTML = renderWarehouseForm(m);
  else if (m.type === 'driver') root.innerHTML = renderDriverMessageModal();
  else if (m.type === 'shipment') root.innerHTML = renderShipmentForm(m);
  else if (m.type === 'runwayDetail') root.innerHTML = renderRunwayDetailModal(m);
  else if (m.type === 'quotePreview') { root.innerHTML = renderQuotePreviewModal(); if (!m.started) { m.started = true; fillQuotePreview(); } }
  wireModalEvents();
}

function modalShell(title, bodyHtml) {
  return `
    <div class="modal-page" id="modalPage">
      <div class="modal-head">
        <h2>${escapeHtml(title)}</h2>
        <button data-close-modal class="modal-close">${icon('x', 18, 'var(--muted)')}</button>
      </div>
      <div class="modal-body">${bodyHtml}</div>
    </div>`;
}

function fieldHtml(label, innerHtml) {
  return `<div class="field"><label>${escapeHtml(label)}</label>${innerHtml}</div>`;
}

/* ---- Driver message modal ---- */
function buildDriverMessage() {
  const ordersForDate = state.orders.filter((o) => isStillIncoming(o) && (o.expectedDate || todayStr()) === state.orderDate);
  return state.warehouses
    .filter((w) => state.selectedWarehousesForDriverMsg.includes(w.id))
    .map((w) => {
      const linesHere = ordersForDate.flatMap((o) => o.items).filter((l) => l.pickupWarehouseId === w.id);
      const total = linesHere.reduce((sum, l) => sum + l.qty, 0);
      const grouped = {};
      linesHere.filter((l) => l.toOwnWarehouse).forEach((l) => { grouped[l.name] = (grouped[l.name] || 0) + l.qty; });
      const breakdown = Object.entries(grouped).map(([name, qty]) => `${name}${qty}`);
      return [`${w.name}${total}`, ...breakdown].join('\n');
    })
    .join('\n\n');
}

function renderDriverMessageModal() {
  const msg = buildDriverMessage();
  const body = `
    <p class="text-xs faint mb2">Header line is the warehouse's total to collect. Lines under it (if any) are the items to split off for 金發 — everything else goes to the main shop.</p>

  return modalShell('Driver collection message', body);
}
