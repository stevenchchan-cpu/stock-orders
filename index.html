<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Stock & Orders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" href="icon-192b.png">
<style>
  :root {
    --forest:#18443D; --forest-light:#9CC4BC; --cream:#FAF8F2; --card:#FFFFFF;
    --border:#E4DDD0; --ink:#20241F; --ink-soft:#3A362E; --muted:#6B6457; --faint:#A39C8C;
    --tint:#F4F0E8; --amber-bg:#F6E3D3; --amber-border:#E8B98A; --amber-text:#7A3E0E;
    --amber-strong:#C2710A; --red-bg:#F6E3D3; --red-text:#B3402A; --green:#DCEAE6; --whatsapp:#25D366;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; padding:0; background:var(--cream); color:var(--ink); font-family:'Inter',-apple-system,sans-serif; }
  body { padding-bottom:84px; min-height:100vh; }
  h1,h2 { margin:0; }
  .font-display { font-family:'Space Grotesk',sans-serif; }
  .font-mono { font-family:'JetBrains Mono',monospace; }
  button { font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; -webkit-appearance:none; }
  input,select,textarea { font-family:inherit; font-size:15px; -webkit-appearance:none; appearance:none; }
  input[type=checkbox] { -webkit-appearance:auto; appearance:auto; width:18px; height:18px; accent-color:var(--forest); flex-shrink:0; }
  a { color:inherit; }
  .hidden { display:none !important; }

  .header { background:var(--forest); padding:20px 20px 14px; position:sticky; top:0; z-index:10; }
  .header .eyebrow { font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:var(--forest-light); }
  .header h1 { font-size:22px; font-weight:700; color:var(--cream); margin-bottom:12px; }
  .header-row { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; }
  .header-row h1 { margin-bottom:0; }
  .date-pill { position:relative; display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:999px; background:var(--cream); color:var(--forest); font-size:14px; font-weight:600; white-space:nowrap; }
  .date-pill input { position:absolute; inset:0; width:100%; height:100%; opacity:0; border:none; padding:0; margin:0; cursor:pointer; }
  .tab-toolbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .tab-toolbar input[type=search] { flex:1; min-width:120px; border:none; }
  .tab-toolbar .chip-btn { padding:6px 12px; border-radius:999px; font-size:12px; font-weight:600; white-space:nowrap; }

  .main { padding:16px; max-width:640px; margin:0 auto; }
  .section { margin-bottom:24px; }
  .section-label { font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); margin-bottom:8px; }

  .card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:12px; }
  .card + .card { margin-top:8px; }

  .btn { display:flex; align-items:center; justify-content:center; gap:6px; padding:12px; border-radius:12px; font-weight:500; font-size:14px; width:100%; }
  .btn-primary { background:var(--forest); color:var(--cream); }
  .btn-primary[disabled] { background:var(--border); color:var(--faint); }
  .btn-ghost { background:transparent; color:var(--muted); border:1px dashed #C9C2B2; }
  .btn-soft { background:var(--green); color:var(--forest); border:1px solid #B7CFC9; }
  .btn-sm { padding:6px 12px; border-radius:999px; font-size:12px; font-weight:500; width:auto; }
  .btn-whatsapp { background:var(--whatsapp); color:#fff; }
  .btn-cancel { background:var(--tint); color:var(--muted); }

  input[type=text],input[type=number],input[type=tel],input[type=date],input[type=search],select,textarea {
    width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--border); background:var(--cream); color:var(--ink);
  }
  textarea { resize:vertical; }
  .field { margin-bottom:12px; }
  .field label { display:block; font-size:12px; font-weight:500; color:var(--muted); margin-bottom:4px; }
  .hint { font-size:12px; color:var(--faint); margin-top:-6px; margin-bottom:12px; }
  .warn-hint { font-size:12px; color:var(--amber-strong); margin-bottom:8px; }

  .chip { display:inline-flex; align-items:center; gap:4px; padding:6px 12px; border-radius:999px; font-size:12px; font-weight:500; }
  @keyframes flash-highlight { 0%,35% { background:var(--amber-bg); } 100% { background:transparent; } }
  .flash-highlight { animation:flash-highlight 1.8s ease-out; border-radius:10px; }
  .tag { font-size:10px; padding:2px 6px; border-radius:999px; background:var(--tint); color:var(--muted); }

  .segmented { display:inline-flex; border:1px solid var(--border); border-radius:999px; overflow:hidden; }
  .segmented button { padding:5px 10px; font-size:12px; font-weight:500; color:var(--muted); }
  .segmented button.active { background:var(--forest); color:#fff; }

  .empty { text-align:center; padding:48px 16px; }
  .empty .title { font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:16px; margin-bottom:4px; }
  .empty .body { font-size:14px; color:var(--muted); margin-bottom:16px; }

  .nav { position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--border); display:flex; justify-content:space-around; padding:8px 8px calc(8px + env(safe-area-inset-bottom)); z-index:20; }
  .nav button { display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 16px; border-radius:12px; position:relative; }
  .nav button svg { width:22px; height:22px; stroke:var(--faint); }
  .nav button span { font-size:11px; font-weight:500; color:var(--faint); }
  .nav button.active svg { stroke:var(--forest); }
  .nav button.active span { color:var(--forest); }
  .nav-badge { position:absolute; top:-2px; right:10px; background:var(--amber-strong); color:#fff; font-size:9px; font-weight:700; border-radius:999px; min-width:14px; height:14px; display:flex; align-items:center; justify-content:center; padding:0 3px; }

  .modal-page { position:fixed; inset:0; background:var(--cream); z-index:50; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .modal-head { position:sticky; top:0; display:flex; align-items:center; justify-content:space-between; padding:16px 20px; background:var(--cream); border-bottom:1px solid var(--border); z-index:2; }
  .modal-head h2 { font-family:'Space Grotesk',sans-serif; font-size:18px; font-weight:600; }
  .modal-close { background:var(--tint); border-radius:999px; padding:6px; }
  .modal-body { padding:20px; padding-bottom:40px; }

  .toast { position:fixed; left:16px; right:16px; top:16px; z-index:60; background:var(--ink); color:var(--cream); padding:12px 16px; border-radius:12px; font-size:14px; font-weight:500; box-shadow:0 8px 24px rgba(0,0,0,.2); }

  .row { display:flex; align-items:center; gap:8px; }
  .row-between { display:flex; align-items:center; justify-content:space-between; }
  .wrap { flex-wrap:wrap; }
  .gap2 { gap:8px; }
  .flex1 { flex:1; min-width:0; }
  .shrink0 { flex-shrink:0; }
  .mt2{margin-top:8px;} .mb2{margin-bottom:8px;} .mt1{margin-top:4px;} .mb1{margin-bottom:4px;}
  .truncate { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .text-xs{font-size:12px;} .text-sm{font-size:14px;}
  .muted{color:var(--muted);} .faint{color:var(--faint);}
  .qty-input { width:56px; padding:8px 4px; border-radius:9px; border:1.5px solid var(--forest); background:#F2F7F5; color:var(--forest); font-weight:700; font-size:16px; text-align:center; }
  .stepper-btn { width:26px; height:26px; border-radius:999px; display:flex; align-items:center; justify-content:center; }
  .index-badge { font-family:'JetBrains Mono',monospace; font-size:12px; width:20px; text-align:center; color:var(--faint); flex-shrink:0; }
  /* Orders tab: the #number is a shortcut to the item's edit form. Bigger
     tap area than it looks, underlined so it reads as tappable. */
  .index-link { width:auto; min-width:28px; min-height:36px; margin:-8px -4px; padding:8px 4px; color:var(--forest); text-decoration:underline; text-decoration-color:var(--border); text-underline-offset:3px; }

  /* Orders tab: the stock figure links to the item's Runway timeline. */
  .avail-link { display:inline; padding:6px 2px; margin:-6px -2px; font:inherit; text-decoration:underline; text-decoration-color:var(--border); text-underline-offset:3px; }
  .price-link { display:inline; font:inherit; text-align:left; padding:0; }

  /* Small popups that sit over the page (cart price pad, purchase details). */
  .popup-backdrop { position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:70; display:flex; align-items:flex-end; justify-content:center; }
  .popup-sheet { background:var(--cream); width:100%; max-width:520px; border-radius:18px 18px 0 0; padding:16px 16px calc(16px + env(safe-area-inset-bottom)); max-height:85vh; overflow-y:auto; }
  .pad-display { font-family:'JetBrains Mono',monospace; font-size:28px; font-weight:700; text-align:right; padding:10px 14px; border-radius:12px; background:#fff; border:1.5px solid var(--forest); color:var(--forest); margin-bottom:12px; min-height:56px; }
  .pad-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .pad-grid button { height:54px; border-radius:12px; background:#fff; border:1px solid var(--border); font-size:22px; font-weight:600; color:var(--ink); display:flex; align-items:center; justify-content:center; }
  .pad-grid button:active { background:var(--tint); }
  .cost-table { width:100%; border-collapse:collapse; font-size:13px; }
  .cost-table th { text-align:left; font-size:11px; font-weight:500; color:var(--muted); padding:6px 4px; border-bottom:1px solid var(--border); }
  .cost-table td { padding:8px 4px; border-bottom:1px solid var(--border); vertical-align:top; }
  .cost-table .num { text-align:right; font-family:'JetBrains Mono',monospace; white-space:nowrap; }

  /* Quote tab */
  .q-chiprow { display:flex; gap:6px; flex-basis:100%; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .q-chiprow::-webkit-scrollbar { display:none; }
  .q-chiprow > * { flex-shrink:0; }
  .q-card { padding:8px 10px; border-radius:12px; }
  .card.q-card + .card.q-card { margin-top:4px; }
  .q-tick { width:22px; height:22px; border-radius:6px; border:1.5px solid #C9C2B2; background:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .q-tick.on { background:var(--forest); border-color:var(--forest); }
  .q-main { text-align:left; min-width:0; display:block; padding:0; }
  .q-off .q-main { opacity:.45; }
  .q-name { font-size:15px; font-weight:600; color:var(--ink); }
  .q-price { font-family:'JetBrains Mono',monospace; font-weight:700; font-size:15px; color:var(--forest); white-space:nowrap; }
  .q-price small { font-family:'Inter',sans-serif; font-weight:500; font-size:11px; color:var(--muted); }
  .q-sub { display:flex; gap:8px; align-items:center; font-size:12px; color:var(--muted); margin-top:2px; white-space:nowrap; overflow:hidden; }
  .q-mono { font-family:'JetBrains Mono',monospace; }
  .q-up { color:var(--red-text); font-weight:600; }
  .q-down { color:#2E7D5B; font-weight:600; }
  .q-mg { background:var(--green); color:var(--forest); border-radius:999px; padding:0 6px; font-weight:600; }
  .q-mg.neg { background:var(--red-bg); color:var(--red-text); }
  .q-link { color:var(--forest); font-weight:600; }
  .q-rent { color:var(--amber-strong); font-weight:600; }
  .q-warn { background:var(--amber-bg); color:var(--amber-text); border-radius:999px; padding:0 6px; font-weight:600; }
  .q-cuts { font-size:12px; color:var(--ink); margin-top:2px; }
  .q-cuts b { color:var(--forest); }
  .q-setup { background:var(--amber-bg); color:var(--amber-text); border-radius:10px; padding:6px 10px; font-size:12px; margin-bottom:6px; }
  .q-selall { display:flex; align-items:center; gap:8px; background:#fff; border:1px solid var(--border); border-radius:999px; padding:6px 12px 6px 8px; font-size:13px; font-weight:600; color:var(--forest); }
  .q-genbtn { display:flex; align-items:center; gap:6px; background:var(--cream); color:var(--forest); border-radius:999px; padding:7px 13px; font-size:13px; font-weight:700; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .q-genbtn:disabled { opacity:.5; }
  .q-sheet .field { margin-bottom:8px; }
  .q-sheet .field label { font-size:11px; margin-bottom:2px; }
  .q-sheet input[type=text], .q-sheet input[type=number], .q-sheet select { padding:8px 10px; background:#fff; }
  .q-pick { width:100%; display:flex; justify-content:space-between; gap:8px; text-align:left; padding:9px 10px; border:1px solid var(--border); border-radius:10px; background:#fff; font-size:14px; }
  .q-calc { background:#fff; border:1px solid var(--border); border-radius:10px; padding:7px 10px; margin-bottom:8px; }
  .q-cuts-edit { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .q-cutchip { display:inline-flex; align-items:center; gap:3px; background:#fff; border:1px solid var(--border); border-radius:999px; padding:3px 6px 3px 10px; font-size:13px; }
  .q-cutchip input { width:64px !important; padding:4px 6px !important; font-size:13px; }
  .q-cutchip button { padding:4px; }
  .q-cuttotal { font-size:12px; color:var(--forest); font-weight:600; }
  .q-addcut { width:auto !important; border-style:dashed !important; color:var(--forest); font-weight:600; padding:6px 10px !important; border-radius:999px !important; font-size:13px; }
  .q-itemrow { width:100%; display:flex; align-items:center; gap:10px; padding:10px 4px; border-bottom:1px solid var(--border); font-size:14px; }
  .q-itemrow.on { color:var(--forest); font-weight:600; }
  .q-itemrow.off { opacity:.45; }
  svg { display:block; }
  ::placeholder { color:var(--faint); }
  [data-hide-when-empty]:empty { display:none; }
</style>
</head>
<body>

<header class="header">
  <div class="eyebrow">Stock &amp; Orders</div>
  <div class="header-row">
    <h1 id="pageTitle" class="font-display">Orders</h1>
    <div id="headerRight"></div>
  </div>
  <div id="tabToolbar" class="tab-toolbar" data-hide-when-empty></div>
</header>

<main class="main" id="mainContent"></main>

<nav class="nav" id="bottomNav"></nav>

<div id="modalRoot"></div>
<div id="popupRoot"></div>
<div id="toastRoot"></div>

<script>
'use strict';

/* ============================================================
   ICONS — minimal inline SVG helpers (mirrors the lucide icons used)
   ============================================================ */
function icon(name, size, color, extra) {
  size = size || 16; color = color || 'currentColor'; extra = extra || '';
  const paths = {
    plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
    calendar: '<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',
    x: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
    trash: '<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>',
    send: '<line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>',
    check: '<polyline points="20 6 9 17 4 12"/>',
    chevronRight: '<polyline points="9 18 15 12 9 6"/>',
    chevronUp: '<polyline points="18 15 12 9 6 15"/>',
    chevronDown: '<polyline points="6 9 12 15 18 9"/>',
    cornerDownRight: '<polyline points="15 10 20 15 15 20"/><path d="M4 4v7a4 4 0 0 0 4 4h12"/>',
    repeat: '<polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>',
    building: '<rect x="4" y="2" width="16" height="20" rx="1"/><line x1="9" y1="6" x2="9" y2="6.01"/><line x1="15" y1="6" x2="15" y2="6.01"/><line x1="9" y1="10" x2="9" y2="10.01"/><line x1="15" y1="10" x2="15" y2="10.01"/><line x1="9" y1="14" x2="9" y2="14.01"/><line x1="15" y1="14" x2="15" y2="14.01"/><line x1="9" y1="18" x2="15" y2="18"/>',
    mapPin: '<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/>',
    cart: '<circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>',
    package: '<line x1="16.5" y1="9.4" x2="7.5" y2="4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/>',
    users: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
    clipboard: '<path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/>',
    alert: '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>',
    minus: '<line x1="5" y1="12" x2="19" y2="12"/>',
    trendingDown: '<polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/>',
    clock: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
    fileText: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>',
    tag: '<path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/>',
  };
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ${extra}>${paths[name] || ''}</svg>`;
}

/* ============================================================
   PORTED BUSINESS LOGIC (dates, messages, real data) — unchanged from the app version
   ============================================================ */
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

const WEEKDAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

function parForDate(item, date) {
  const day = date.getDay();
  if (item.parByDay && item.parByDay[day] != null && item.parByDay[day] !== '') {
    return Number(item.parByDay[day]);
  }
  return item.par;
}

function toLocalDateStr(d) {
  // Local calendar date (YYYY-MM-DD) based on the device's own clock/timezone,
  // not UTC — toISOString() would shift the date near midnight in many timezones.
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function todayStr() {
  return toLocalDateStr(new Date());
}

function tomorrowStr() {
  const d = new Date();
  d.setDate(d.getDate() + 1);
  return toLocalDateStr(d);
}

function isStillIncoming(order) {
  // Assume delivered once we're past the expected date — no manual "received" step needed.
  const expected = order.expectedDate || (order.placedAt ? toLocalDateStr(new Date(order.placedAt)) : todayStr());
  return expected >= todayStr();
}

function pendingQtyForItem(itemId, orders, opts = {}) {
  const { onDate, throughDate, includeWarehouse = true } = opts;
  return orders
    .filter(isStillIncoming)
    .filter((o) => {
      const d = o.expectedDate || todayStr();
      if (throughDate) return d <= throughDate;
      if (onDate) return d === onDate;
      return true;
    })
    .reduce((sum, o) => {
      const line = o.items.find((i) => i.itemId === itemId);
      if (!line) return sum;
      if (!includeWarehouse && line.toOwnWarehouse) return sum;
      return sum + line.qty;
    }, 0);
}

function defaultOrderDate() {
  // After ~1pm, default to tomorrow to match typical supplier cutoffs — but this is just a
  // starting point; the date picker lets you account for holidays, closures, etc.
  return new Date().getHours() < 13 ? todayStr() : tomorrowStr();
}

function formatDateLabel(dateStr) {
  if (!dateStr) return '';
  if (dateStr === todayStr()) return 'Today';
  if (dateStr === tomorrowStr()) return 'Tomorrow';
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
}

function effectivePickupWarehouseId(item, supplier) {
  return item?.defaultWarehouseId || supplier?.defaultWarehouseId || '';
}

function gaugeLevel(item, orders, date = new Date()) {
  // 0..1 fill, accounting for stock + incoming — excludes stock earmarked for your own
  // warehouse, since that won't land on the shop shelf this par level is meant to track.
  const par = parForDate(item, date);
  const pending = pendingQtyForItem(item.id, orders, { includeWarehouse: false });
  const total = item.stock + pending;
  if (par <= 0) return 1;
  return Math.max(0, Math.min(1, total / par));
}

const WEEKDAY_CN = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];

function chineseDayWord(dateStr, isAdditional, prefix) {
  let word;
  if (!dateStr || dateStr === todayStr()) word = isAdditional ? '今日加多' : '今日';
  else if (dateStr === tomorrowStr()) word = isAdditional ? '聽日加多' : '聽日';
  else {
    const d = new Date(dateStr + 'T00:00:00');
    const dateLabel = `${WEEKDAY_CN[d.getDay()]}${d.getMonth() + 1}月${d.getDate()}日`;
    word = isAdditional ? `${dateLabel}加多` : dateLabel;
  }
  return prefix ? `${prefix} ${word}` : word;
}

function buildMessage(supplierName, lines, dateStr, isAdditional, prefix) {
  const dayWord = chineseDayWord(dateStr, isAdditional, prefix);
  const formatLines = (arr) => arr.map((l) => `${l.qty}${l.unit || ''}${l.name}`).join('\n');
  const shopLines = lines.filter((l) => !l.toOwnWarehouse);
  const warehouseLines = lines.filter((l) => l.toOwnWarehouse);

  if (warehouseLines.length === 0) {
    // everything is going to the shop — no need to label it
    return `${dayWord}\n${formatLines(shopLines)}`;
  }
  if (shopLines.length === 0) {
    // everything is going to your own warehouse
    return `${dayWord}\n(葵):\n${formatLines(warehouseLines)}`;
  }
  // mixed order — keep the two destinations clearly separated so the driver isn't guessing
  return `${dayWord}\n舖:\n${formatLines(shopLines)}\n\n(葵):\n${formatLines(warehouseLines)}`;
}

async function sendOrShareMessage(phone, message, windowName) {
  // Always open-ended — no phone number is ever plugged in. WhatsApp opens with the
  // message pre-filled and lets the user pick one or more contacts or a group themselves.
  window.open(`https://wa.me/?text=${encodeURIComponent(message)}`, windowName || `wa_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`);
  return 'opened';
}




/* ============================================================
   STORAGE — localStorage, with debounced writes so rapid state changes
   (typing a quantity, dragging, etc.) don't hammer the disk on every keystroke
   ============================================================ */
const STORAGE_PREFIX = 'stockOrderApp:';
const pendingWrites = {};
const writeTimers = {};

function loadJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(STORAGE_PREFIX + key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) {
    console.error('load failed', key, e);
    return fallback;
  }
}

function saveJSONNow(key, value) {
  try {
    localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(value));
  } catch (e) {
    console.error('save failed', key, e);
  }
}

// Debounced save: coalesces bursts of writes to the same key into one disk write ~200ms later.
function saveJSONDebounced(key, value) {
  pendingWrites[key] = value;
  clearTimeout(writeTimers[key]);
  writeTimers[key] = setTimeout(() => {
    saveJSONNow(key, pendingWrites[key]);
    delete pendingWrites[key];
  }, 200);
}

function flushAllWrites() {
  Object.keys(writeTimers).forEach((key) => {
    clearTimeout(writeTimers[key]);
    if (key in pendingWrites) {
      saveJSONNow(key, pendingWrites[key]);
      delete pendingWrites[key];
    }
  });
}
window.addEventListener('beforeunload', flushAllWrites);
window.addEventListener('pagehide', flushAllWrites);

/* ============================================================
   STATE — a single global object. Renders are targeted (see render* functions)
   rather than one big re-render, to stay fast with 150-250 items.
   ============================================================ */

  quoteSetupHidden: loadJSON('quoteSetupHidden', false),

  quoteSearch: '',

function persist(key) {

/* ============================================================
   TOAST
   ============================================================ */
let toastTimer = null;
function showToast(msg) {
  const root = document.getElementById('toastRoot');
  root.innerHTML = `<div class="toast">${escapeHtml(msg)}</div>`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { root.innerHTML = ''; }, 3500);
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str == null ? '' : String(str);
  return d.innerHTML;
}

// Alphabetical supplier list for anywhere you PICK a supplier from a dropdown
// (item form, shipment form, cart line override). Locale-aware so Chinese
// names sort sensibly, not by raw character code. Does NOT touch the
// Suppliers tab's own management list, which stays in your set order.
function sortedSuppliers() {
  return [...state.suppliers].sort((a, b) => (a.name || '').localeCompare(b.name || '', 'zh-Hant'));
}

/* ============================================================
   DATA MUTATIONS — each updates state, persists (debounced), and re-renders
   only what's needed rather than the whole app.
   ============================================================ */
function updateSuppliers(next) { state.suppliers = next; persist('suppliers'); }
function updateItems(next) { state.items = next; persist('items'); }
function updateCart(next) { state.cart = next; persist('cart'); }
function updateOrders(next) { state.orders = next; persist('orders'); }
function updateWarehouses(next) { state.warehouses = next; persist('warehouses'); }
function updateShipments(next) { state.shipments = next; persist('shipments'); }

function effectiveSupplierId(cartLine, item) {
  return cartLine.supplierOverride || (item && item.supplierId);
}

function addToCart(itemId, qty) {
  if (!qty || qty <= 0) return;
  const item = state.items.find((i) => i.id === itemId);
  const supplier = state.suppliers.find((s) => s.id === (item && item.supplierId));
  const pickupWarehouseId = effectivePickupWarehouseId(item, supplier);
  const qp = cartPrefillPrice(item);
  updateCart([...state.cart, { id: uid(), itemId, qty, ...(pickupWarehouseId ? { pickupWarehouseId } : {}), ...(qp > 0 ? { price: qp } : {}) }]);
  state.draftQty[itemId] = '';
}

function addAllToCart() {
  const entries = Object.entries(state.draftQty).filter(([, v]) => parseFloat(v) > 0);
  if (entries.length === 0) return;
  const newLines = entries.map(([itemId, v]) => {
    const qty = parseFloat(v);
    const item = state.items.find((i) => i.id === itemId);
    const supplier = state.suppliers.find((s) => s.id === (item && item.supplierId));
    const pickupWarehouseId = effectivePickupWarehouseId(item, supplier);
    const qp = cartPrefillPrice(item);
    return { id: uid(), itemId, qty, ...(pickupWarehouseId ? { pickupWarehouseId } : {}), ...(qp > 0 ? { price: qp } : {}) };
  });
  updateCart([...state.cart, ...newLines]);
  entries.forEach(([itemId]) => { state.draftQty[itemId] = ''; });
}

function setCartQty(lineId, qty) {
  if (qty <= 0) {
    updateCart(state.cart.filter((c) => c.id !== lineId));
  } else {
    updateCart(state.cart.map((c) => (c.id === lineId ? { ...c, qty } : c)));
  }
}

function setCartPickupWarehouse(lineId, warehouseId) {
  updateCart(state.cart.map((c) => (c.id === lineId ? { ...c, pickupWarehouseId: warehouseId } : c)));
}

function setCartSupplierOverride(lineId, supplierId) {
  updateCart(state.cart.map((c) => {
    if (c.id !== lineId) return c;
    const item = state.items.find((i) => i.id === c.itemId);
    const newSupplier = state.suppliers.find((s) => s.id === supplierId);
    // Moving to a different supplier means it's physically collected from
    // wherever THAT supplier's stock sits — any previously-set pickup
    // warehouse (auto or manual) no longer applies, so recompute it fresh.
    // Switching to a DIFFERENT supplier uses that supplier's default warehouse
    // (the item's own pickup default belongs to its usual supplier, so it
    // doesn't apply). Switching back to the usual supplier restores the
    // normal default (item first, then supplier).
    const next = { ...c };
    const isOtherSupplier = item && supplierId && supplierId !== item.supplierId;
    const newPickup = isOtherSupplier
      ? (newSupplier && newSupplier.defaultWarehouseId) || ''
      : effectivePickupWarehouseId(item, newSupplier);
    if (newPickup) next.pickupWarehouseId = newPickup;
    else delete next.pickupWarehouseId;

    if (!item || supplierId === item.supplierId) delete next.supplierOverride;
    else next.supplierOverride = supplierId;
    return next;
  }));
}

function toggleCartWarehouse(lineId) {
  updateCart(state.cart.map((c) => (c.id === lineId ? { ...c, toOwnWarehouse: !c.toOwnWarehouse } : c)));
}

function computeCartGroups() {
  // Alphabetical (same zh-Hant sort as the supplier pickers), not the
  // Suppliers tab's own manual order.
  return sortedSuppliers()
    .map((s) => {
      const lines = state.cart
        .map((c) => ({ ...c, item: state.items.find((i) => i.id === c.itemId) }))
        .filter((l) => l.item && effectiveSupplierId(l, l.item) === s.id);
      return { supplier: s, lines };
    })
    .filter((g) => g.lines.length > 0);
}

function computeIncomingOrders() {
  // Newest sent first, so the order you just sent is at the top of its date.
  return state.orders.filter(isStillIncoming).sort((a, b) => (b.placedAt || '').localeCompare(a.placedAt || ''));
}

function sendSupplierOrder(group, dateStr) {
  const { supplier, lines } = group;
  const expectedDate = dateStr || todayStr();
  const isAdditional = state.orders.some((o) => o.supplierId === supplier.id && o.expectedDate === expectedDate);
  const prefix = supplier.isInternalAccount ? supplier.name : undefined;
  const message = buildMessage(
    supplier.name,
    lines.map((l) => ({ name: l.item.name, qty: l.qty, unit: l.item.unit, toOwnWarehouse: l.toOwnWarehouse })),
    expectedDate,
    isAdditional,
    prefix
  );
  sendOrShareMessage(supplier.whatsapp, message, 'wa_supplier').then(() => {
    showToast(`Opened WhatsApp for ${supplier.name} — pick who to send it to.`);
  });

  const newOrder = {
    id: uid(),
    supplierId: supplier.id,
    supplierName: supplier.name,
    items: lines.map((l) => ({
      itemId: l.itemId,
      qty: l.qty,
      name: l.item.name,
      unit: l.item.unit,
      toOwnWarehouse: l.toOwnWarehouse || false,
      pickupWarehouseId: l.pickupWarehouseId || '',
      ...(Number(l.price) > 0 ? { price: Number(l.price) } : {}),
    })),
    placedAt: new Date().toISOString(),
    expectedDate,
    status: 'pending',
  };
  // Keep the latest price on the item too, so it outlives the order
  // (orders are cleared out after 90 days).
  const priced = lines.filter((l) => Number(l.price) > 0);
  if (priced.length) {
    updateItems(state.items.map((it) => {
      const l = priced.filter((x) => x.itemId === it.id).pop();
      return l ? { ...it, lastCost: { price: Number(l.price), date: expectedDate, supplierId: supplier.id } } : it;
    }));
  }
  // Key SKU link: deduct this order from the supplier's landed shipments
  // (earliest rent-free deadline first) and remember what was taken so
  // Undo can put it back exactly.
  newOrder.drawdowns = applyDrawdownsForOrder(newOrder);
  updateOrders([...state.orders, newOrder]);
  updateCart(state.cart.filter((c) => !lines.some((l) => l.id === c.id)));
  renderTab();
}

function cancelOrder(order) {
  revertDrawdownsForOrder(order); // put any Key SKU drawdowns back on their shipments
  updateOrders(state.orders.filter((o) => o.id !== order.id));
  const restoredLines = order.items.map((line) => {
    const item = state.items.find((i) => i.id === line.itemId);
    const override = item && item.supplierId !== order.supplierId ? order.supplierId : undefined;
    return {
      id: uid(),
      itemId: line.itemId,
      qty: line.qty,
      ...(override ? { supplierOverride: override } : {}),
      ...(line.toOwnWarehouse ? { toOwnWarehouse: true } : {}),
      ...(line.pickupWarehouseId ? { pickupWarehouseId: line.pickupWarehouseId } : {}),
      ...(Number(line.price) > 0 ? { price: Number(line.price) } : {}),
    };
  });
  updateCart([...state.cart, ...restoredLines]);
  renderTab();
}

/* Any post-send revision goes through here so Key SKU drawdowns stay honest.
   IMPORTANT: this adjusts the SAME batch(es) the order originally drew from —
   it does NOT revert-and-re-pick from scratch. Re-picking against TODAY's
   shipment list is wrong for anything but a same-day edit: given long lead
   times (contracts booked months out), the shipment landscape will often have
   changed by the time an old pending order gets revised — a new batch may
   have landed, the original may since be the only one with room, etc. Blindly
   re-running "pick earliest available today" could silently reassign the
   order onto a batch it never actually touched, corrupting THAT batch's
   numbers instead. Adjusting the original batch by the delta keeps history
   intact; only quantity ABOVE what the original batch can still hold spills
   to a fresh pick (same as a brand-new order would do for that excess). */
function reviseOrderItems(orderId, nextItemsFn) {
  const order = state.orders.find((o) => o.id === orderId);
  if (!order) return;

  const nextItems = nextItemsFn(order.items);
  if (nextItems.length === 0) {
    revertDrawdownsForOrder(order);
    updateOrders(state.orders.filter((o) => o.id !== orderId));
    state.revisingOrderId = null;
    return;
  }

  const sumByItem = (items) => {
    const m = new Map();
    items.forEach((line) => {
      const q = Number(line.qty) || 0;
      if (q > 0) m.set(line.itemId, (m.get(line.itemId) || 0) + q);
    });
    return m;
  };
  const oldWanted = sumByItem(order.items);
  const newWanted = sumByItem(nextItems);

  // This order's existing drawdowns, grouped by the item each shipment belongs to.
  const shipments = state.shipments.map((s) => ({ ...s }));
  const oldByItem = new Map();
  (order.drawdowns || []).forEach((dd) => {
    const sh = shipments.find((s) => s.id === dd.shipmentId);
    if (!sh) return;
    if (!oldByItem.has(sh.itemId)) oldByItem.set(sh.itemId, []);
    oldByItem.get(sh.itemId).push({ ...dd });
  });

  const nextDrawdowns = [];
  const allItemIds = new Set([...oldWanted.keys(), ...newWanted.keys()]);

  allItemIds.forEach((itemId) => {
    const delta = (newWanted.get(itemId) || 0) - (oldWanted.get(itemId) || 0);
    const existing = oldByItem.get(itemId) || [];

    if (delta === 0) { nextDrawdowns.push(...existing); return; }

    if (delta < 0) {
      // Give back LIFO: release whatever was drawn most recently first (the
      // "overflow" batch from an earlier increase), before touching the
      // original batch. Otherwise a decrease-after-increase would drain the
      // wrong one back to empty while leaving the overflow batch untouched.
      let toGiveBack = -delta;
      const reduced = [...existing].reverse().map((dd) => {
        if (toGiveBack <= 0) return dd;
        const sh = shipments.find((s) => s.id === dd.shipmentId);
        const giveBack = Math.min(dd.qty, toGiveBack);
        if (sh) {
          sh.drawnDown = Math.max(0, (Number(sh.drawnDown) || 0) - giveBack);
          if (shipmentRemaining(sh) > 0) delete sh.finishedAt;
        }
        toGiveBack -= giveBack;
        return { shipmentId: dd.shipmentId, qty: dd.qty - giveBack };
      });
      nextDrawdowns.push(...reduced.reverse().filter((dd) => dd.qty > 0));
      return;
    }

    // delta > 0: top up the SAME batch(es) first; only the amount that batch
    // can't hold spills over to a fresh pick (excluding batches already used
    // by this order, so it can't double-book the same one twice).
    let toDraw = delta;
    existing.forEach((dd) => {
      nextDrawdowns.push({ ...dd });
      if (toDraw <= 0) return;
      const sh = shipments.find((s) => s.id === dd.shipmentId);
      if (!sh) return;
      const room = shipmentRemaining(sh);
      if (room <= 0) return;
      const take = Math.min(room, toDraw);
      sh.drawnDown = (Number(sh.drawnDown) || 0) + take;
      if (shipmentRemaining(sh) <= 0 && !sh.finishedAt) sh.finishedAt = todayStr();
      toDraw -= take;
      nextDrawdowns[nextDrawdowns.length - 1].qty += take;
    });
    if (toDraw > 0) {
      const item = state.items.find((i) => i.id === itemId);
      if (item && item.keySku) {
        const usedIds = new Set(existing.map((dd) => dd.shipmentId));
        const fresh = shipments
          .filter((s) => s.itemId === itemId && s.received && s.supplierId === order.supplierId
            && shipmentRemaining(s) > 0 && !usedIds.has(s.id))
          .sort((a, b) => (a.rentFreeDeadline || '9999-99-99').localeCompare(b.rentFreeDeadline || '9999-99-99'));
        // Same spill rule as a new order: next batch, then the next, and so on.
        nextDrawdowns.push(...drawFromBatches(fresh, toDraw).taken);
        // Anything still left is a spot purchase — not drawn anywhere, same as normal.
      }
    }
  });

  updateShipments(shipments);
  updateOrders(state.orders.map((o) => (o.id === orderId
    ? { ...o, items: nextItems, drawdowns: nextDrawdowns.filter((d) => d.qty > 0) }
    : o)));
}

function setOrderLineQty(orderId, itemIndex, qty) {
  if (!qty || qty <= 0) { removeOrderLine(orderId, itemIndex); return; }
  reviseOrderItems(orderId, (items) =>
    items.map((line, idx) => (idx === itemIndex ? { ...line, qty } : line)));
}

function setOrderLinePickupWarehouse(orderId, itemIndex, warehouseId) {
  // Pickup location only — no quantity change, so drawdowns are unaffected.
  updateOrders(state.orders.map((o) => {
    if (o.id !== orderId) return o;
    return { ...o, items: o.items.map((line, idx) => (idx === itemIndex ? { ...line, pickupWarehouseId: warehouseId } : line)) };
  }));
}

function removeOrderLine(orderId, itemIndex) {
  reviseOrderItems(orderId, (items) => items.filter((_, idx) => idx !== itemIndex));
}

/* ---- suppliers / items / warehouses CRUD ---- */
function saveSupplier(data) {
  if (data.id) {
    updateSuppliers(state.suppliers.map((s) => (s.id === data.id ? data : s)));
  } else {
    updateSuppliers([...state.suppliers, { ...data, id: uid() }]);
  }
  closeModal();
}
function deleteSupplier(id) {
  updateSuppliers(state.suppliers.filter((s) => s.id !== id));
  closeModal();
}

function saveItem(data) {
  const { insertAfterId, ...rest } = data;
  if (rest.id) {
    // MERGE, don't replace. The item form only knows about its own fields, so
    // replacing wholesale would silently wipe anything set elsewhere — e.g.
    // "Other stock" on the Runway tab. Merging keeps unknown fields safe and
    // means new fields added later can't be clobbered by an old form.
    updateItems(state.items.map((i) => (i.id === rest.id ? { ...i, ...rest } : i)));
  } else {
    const newItem = { ...rest, id: uid() };
    if (insertAfterId) {
      const idx = state.items.findIndex((i) => i.id === insertAfterId);
      const next = [...state.items];
      next.splice(idx + 1, 0, newItem);
      updateItems(next);
    } else {
      updateItems([...state.items, newItem]);
    }
  }
  closeModal();
}
function deleteItem(id) {
  updateItems(state.items.filter((i) => i.id !== id));
  // Otherwise a leftover unsent cart line for this item becomes a permanent
  // orphan — invisible in the cart list (which requires a real item to
  // group by supplier) yet still counted in the pickup-locations summary,
  // showing a "Not set" that can never actually be found or fixed.
  if (state.cart.some((c) => c.itemId === id)) updateCart(state.cart.filter((c) => c.itemId !== id));
  closeModal();
}
function moveItem(id, direction) {
  const idx = state.items.findIndex((i) => i.id === id);
  const swapWith = direction === 'up' ? idx - 1 : idx + 1;
  if (idx === -1 || swapWith < 0 || swapWith >= state.items.length) return;
  const next = [...state.items];
  [next[idx], next[swapWith]] = [next[swapWith], next[idx]];
  updateItems(next);
  renderTab();
}

function saveWarehouse(data) {
  if (data.id) {
    updateWarehouses(state.warehouses.map((w) => (w.id === data.id ? data : w)));
  } else {
    updateWarehouses([...state.warehouses, { ...data, id: uid() }]);
  }
  closeModal();
}
function deleteWarehouse(id) {
  updateWarehouses(state.warehouses.filter((w) => w.id !== id));
  updateSuppliers(state.suppliers.map((s) => (s.defaultWarehouseId === id ? { ...s, defaultWarehouseId: '' } : s)));
  updateItems(state.items.map((i) => (i.defaultWarehouseId === id ? { ...i, defaultWarehouseId: '' } : i)));
  updateCart(state.cart.map((c) => {
    if (c.pickupWarehouseId !== id) return c;
    const { pickupWarehouseId, ...rest } = c;
    return rest;
  }));
  closeModal();
}

// Import/export: reads/writes a plain JSON file chosen from the device itself.
// Nothing here is baked into the app's code, so no business data is ever public.
function exportDataToFile() {
  const data = {
    suppliers: state.suppliers,
    items: state.items,
    warehouses: state.warehouses,
    orders: state.orders,
    cart: state.cart,
    shipments: state.shipments,
    quoteLines: state.quoteLines,
    quoteCats: state.quoteCats,
    quoteCuts: state.quoteCuts,
    company: state.company,
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `stock-orders-backup-${todayStr()}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  const stillPending = data.orders.filter(isStillIncoming).length;
  showToast(`Backup saved: ${data.suppliers.length} suppliers, ${data.items.length} items, ${data.cart.length} in cart, ${stillPending} pending orders.`);
}

function importDataFromFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data || typeof data !== 'object') throw new Error('bad format');
      if (Array.isArray(data.suppliers)) updateSuppliers(data.suppliers);
      if (Array.isArray(data.items)) updateItems(data.items);
      if (Array.isArray(data.warehouses)) updateWarehouses(data.warehouses);
      if (Array.isArray(data.orders)) updateOrders(data.orders);
      if (Array.isArray(data.cart)) updateCart(data.cart);
      if (Array.isArray(data.shipments)) updateShipments(data.shipments);
      if (Array.isArray(data.quoteLines)) updateQuoteLines(data.quoteLines);
      if (Array.isArray(data.quoteCats)) { state.quoteCats = data.quoteCats; persist('quoteCats'); }
      if (Array.isArray(data.quoteCuts)) { state.quoteCuts = data.quoteCuts; persist('quoteCuts'); }
      if (data.company && typeof data.company === 'object') { state.company = data.company; persist('company'); }
      renderTab();
      showToast('Data imported.');
    } catch (err) {
      showToast("Couldn't read that file — is it the right export?");
    }
  };
  reader.readAsText(file);
}

const TABS = [

function setTab(tab) {
  // Remember exactly where we were on the tab we're leaving...
  state.scrollPositions[state.tab] = window.scrollY;
  state.tab = tab;
  renderTab();
  renderNav();
  // ...and jump back to that spot if we've visited this tab before this session (else top, as before).
  const restoreY = state.scrollPositions[tab] || 0;
  requestAnimationFrame(() => window.scrollTo(0, restoreY));
}

function renderNav() {
  const nav = document.getElementById('bottomNav');
  nav.innerHTML = TABS.map((t) => {
    const active = state.tab === t.key ? 'active' : '';
    const badge = t.key === 'cart' && state.cart.length > 0
      ? `<span class="nav-badge">${state.cart.length > 99 ? '99+' : state.cart.length}</span>` : '';
    return `<button data-tab="${t.key}" class="${active}">
      <span style="position:relative;display:block;">${icon(t.icon, 22)}${badge}</span>
      <span>${t.label}</span>
    </button>`;
  }).join('');
  document.getElementById('pageTitle').textContent = TABS.find((t) => t.key === state.tab).title;
}
document.getElementById('bottomNav').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-tab]');

// Small pill-button helper, shared by any toolbar/filter chip.
function chip(active, label, attr) {
  return `<button ${attr} class="btn-sm chip-btn" style="background:${active ? 'var(--ink)' : 'rgba(255,255,255,.9)'};color:${active ? '#fff' : 'var(--forest)'};font-weight:${active ? '600' : '500'};">${label}</button>`;

// Pinned toolbar inside the sticky header — search + the one or two controls
// worth reaching without scrolling, per tab. Filters that are a one-time

function renderTabToolbar() {
  if (state.tab === 'today') {
    if (state.suppliers.length === 0 || state.items.length === 0) return '';

    return `

function renderTab() {

    key: 'tag', label: 'Tag',

    matches: (item, value) => (item.tags || []).includes(value),
  },
  {
    key: 'warehouse', label: 'Warehouse',
    getOptions: (items, suppliers, warehouses) => (warehouses || []).map((w) => ({ value: w.id, label: w.name })),
    // Pickup location resolves item override -> supplier default, the same way
    // the order rows and driver collection messages do it.
    matches: (item, value) => {

];

function computeIncomingBreakdown(orders, orderDate) {
  const map = {};
  orders.forEach((o) => {
    if (!isStillIncoming(o)) return;
    const d = o.expectedDate || todayStr();
    o.items.forEach((line) => {
      if (line.toOwnWarehouse) return;
      if (!map[line.itemId]) map[line.itemId] = { cumulative: 0, exact: 0, future: 0 };
      if (d <= orderDate) map[line.itemId].cumulative += line.qty;
      if (d === orderDate) map[line.itemId].exact += line.qty;
      if (d > orderDate) map[line.itemId].future += line.qty;
    });
  });
  return map;
}

function renderOrdersTab() {
  if (state.suppliers.length === 0 || state.items.length === 0) {
    return renderEmptyState(
      "Let's set up your stock list",
      'Add your suppliers and items first, then your daily order list builds itself.',
      state.suppliers.length === 0 ? 'Add a supplier' : 'Add stock items',
      "goToSetup()"
    );
  }

  const incomingBreakdown = computeIncomingBreakdown(state.orders, state.orderDate);
  const suggestionBase = computeSuggestionBase();
  const activeFilterFields = FILTER_FIELDS.filter((f) => f.getOptions(state.items, state.suppliers, state.warehouses).length > 0);
  let activeFilterDef = activeFilterFields.find((f) => f.key === state.filterField) || activeFilterFields[0];

  const list = state.items
    .map((it, idx) => ({ item: it, index: idx + 1 }))
    .filter((x) => !x.item.inactive)
    .filter((x) => !state.filterValue || !activeFilterDef || activeFilterDef.matches(x.item, state.filterValue))
    .filter((x) => !state.onlyOrderedForDate || ((incomingBreakdown[x.item.id] && incomingBreakdown[x.item.id].exact) || 0) > 0);

  const orderingForToday = state.orderDate === todayStr();

  const rowsHtml = list.map(({ item, index }) => {
    const draft = state.draftQty[item.id] || '';
    const b = incomingBreakdown[item.id] || { cumulative: 0, exact: 0, future: 0 };
    const hasIncoming = orderingForToday ? (b.exact > 0 || b.future > 0) : (b.cumulative > 0 || b.exact > 0 || b.future > 0);
    const supplier = state.suppliers.find((s) => s.id === item.supplierId);
    const pickupWarehouse = state.warehouses.find((w) => w.id === effectivePickupWarehouseId(item, supplier));
    const incomingText = hasIncoming
      ? (orderingForToday ? `${b.exact} | ${b.future}` : `${b.cumulative} | ${b.exact} | ${b.future}`)
      : '';
    const tagsHtml = (item.tags || []).length
      ? `<div class="row wrap" style="gap:4px;margin-top:2px;">${item.tags.map((t) => `<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>` : '';
    const nameLower = item.name.toLowerCase();
    const codeLower = (item.itemCode || '').toLowerCase();
    const avail = drawdownAvailability(item);
    // Rent-free date of the batch an order would draw from, as just d/m (no label)
    // (e.g. 14/11). Amber within 7 days, red once passed.
    let rfHtml = '';
    if (avail && avail.qty > 0 && avail.deadline) {
      const [, mm, dd] = avail.deadline.split('-');
      const left = daysFromToday(avail.deadline);
      const rfColor = left < 0 ? 'var(--red-text)' : left <= 7 ? 'var(--amber-strong)' : 'var(--muted)';
      rfHtml = ` <span style="font-size:10px;font-weight:500;color:${rfColor};">${Number(dd)}/${Number(mm)}</span>`;
    }
    // ω = nothing landed from any supplier, but a shipment is in transit.
    const omega = !avail && hasInTransit(item);
    // The whole stock figure is a link to this item's Runway timeline.
    const availHtml = avail
      ? `<span class="shrink0" style="white-space:nowrap;"> · <button data-open-runway-detail="${item.id}" class="avail-link"><span style="color:var(--forest);font-weight:600;">${avail.qty}</span>${rfHtml ? ` <span class="faint">|</span>${rfHtml}` : ''}${(avail.alpha || avail.beta) ? ` <span style="color:var(--forest);font-weight:600;">${[avail.alpha ? 'α' : '', avail.beta ? 'β' : ''].filter(Boolean).join(' ')}</span>` : ''}</button></span>`
      : omega
        ? `<span class="shrink0" style="white-space:nowrap;"> · <button data-open-runway-detail="${item.id}" class="avail-link"><span style="color:var(--forest);font-weight:600;">0</span> <span style="color:#3B7EA1;font-weight:600;">ω</span></button></span>`
        : '';
    const sug = suggestedQty(suggestionBase, item.id, b.exact);
    const sugHtml = sug
      ? `<button data-fill-suggest="${item.id}:${sug.qty}" title="Avg ${Math.round(sug.avg * 10) / 10}/trading day (shop only)" style="margin-top:3px;font-size:10px;font-weight:600;color:var(--amber-strong);background:var(--amber-bg);border-radius:999px;padding:1px 8px;">sug ${sug.qty}</button>`
      : '';
    const cost = displayCost(item);
    const costHtml = cost
      ? `<span style="font-size:10px;font-weight:600;white-space:nowrap;color:${cost.kind === 'avg' ? 'var(--forest)' : 'var(--muted)'};">${cost.kind === 'avg' ? 'avg ' : cost.kind === 'quote' ? 'quote ' : ''}${fmtMoney(cost.price)}</span>`
      : `<span style="font-size:9px;text-transform:uppercase;letter-spacing:.03em;color:var(--forest);">Qty</span>`;
    return `
      <div class="card" data-order-row data-name="${escapeHtml(nameLower)}" data-code="${escapeHtml(codeLower)}">
        <div class="row" style="gap:10px;">
          <button data-edit-item="${item.id}" class="index-badge index-link" title="Edit this item">#${index}</button>
          <div class="flex1" style="min-width:0;">
            <button data-quote-item="${item.id}" class="price-link text-sm truncate" style="display:block;max-width:100%;font-weight:500;color:var(--ink);text-decoration:underline;text-decoration-color:var(--border);text-underline-offset:3px;" title="Enter a quoted price">${escapeHtml(item.name)}</button>
            <div class="text-xs muted" style="display:flex;min-width:0;"><span class="truncate" style="min-width:0;">${escapeHtml(supplier ? supplier.name : 'No supplier')} · ${escapeHtml(pickupWarehouse ? pickupWarehouse.name : 'varies')}</span>${availHtml}</div>
            ${tagsHtml}
            ${hasIncoming ? `<div class="text-xs truncate font-mono muted" data-incoming-text>${incomingText}</div>` : ''}
          </div>
          <div class="shrink0" style="text-align:center;">
            <div style="line-height:1.4;">${costHtml}</div>
            <div class="row" style="gap:6px;">
              <input type="number" inputmode="decimal" placeholder="0" value="${draft}" data-draft-qty="${item.id}"
                class="qty-input" style="width:56px;">
              <button data-add-to-cart="${item.id}" class="stepper-btn" style="background:var(--forest);width:36px;height:36px;">
                ${icon('plus', 15, '#fff')}
              </button>
            </div>
            ${sugHtml}
          </div>
        </div>
      </div>`;
  }).join('');

  return `
    <div>

      <section class="section">
        <div class="section-label" style="margin-bottom:8px;">Order list</div>

        <p class="text-xs faint mb2">${orderingForToday ? 'Numbers = incoming today, incoming after today' : `Numbers = total incoming so far, incoming on ${formatDateLabel(state.orderDate)}, incoming after`}</p>

        <div class="row wrap gap2 mb2">
          ${activeFilterFields.length > 1 ? `
            <select id="filterFieldSelect" style="width:auto;font-size:13px;padding:6px 8px;">
              ${activeFilterFields.map((f) => `<option value="${f.key}" ${f.key === (activeFilterDef && activeFilterDef.key) ? 'selected' : ''}>Filter by: ${f.label}</option>`).join('')}
            </select>` : ''}
          ${activeFilterDef ? `
            <select id="filterValueSelect" style="width:auto;font-size:13px;padding:6px 8px;">
              <option value="">All ${activeFilterDef.label.toLowerCase()}s</option>
              ${activeFilterDef.getOptions(state.items, state.suppliers, state.warehouses).map((o) => `<option value="${escapeHtml(o.value)}" ${o.value === state.filterValue ? 'selected' : ''}>${escapeHtml(o.label)}</option>`).join('')}
            </select>` : ''}
          ${(state.filterValue || state.search || state.onlyOrderedForDate) ? `<button id="clearFiltersBtn" class="text-xs" style="font-weight:500;color:var(--amber-strong);">Clear filters</button>` : ''}
        </div>

        <label class="row" style="gap:8px;margin-bottom:12px;cursor:pointer;">
          <input type="checkbox" id="onlyOrderedCheckbox" ${state.onlyOrderedForDate ? 'checked' : ''}>
          <span class="text-xs muted">Only items already ordered for ${formatDateLabel(state.orderDate)}</span>
        </label>

        <div id="orderListRows" style="display:flex;flex-direction:column;gap:8px;">
          ${list.length === 0 ? `<p class="text-sm muted" style="text-align:center;padding:24px 0;">No items match your search.</p>` : rowsHtml}
        </div>
      </section>
    </div>`;
}

function goToSetup() {
  if (state.suppliers.length === 0) state.showSuppliers = true;

// Cheap, no-rerender text filter: toggles visibility of existing rows instead of rebuilding the list.
// Remembers where you were scrolled to right as a search begins, and jumps
// back there once it's cleared back to empty. So: scroll deep into a long
// list, search to find and add something, clear the search — you land back
// exactly where you left off instead of at the top.
function trackSearchScroll(tabKey, prevVal, newVal) {
  const wasEmpty = !prevVal || !prevVal.trim();
  const isEmpty = !newVal || !newVal.trim();
  if (wasEmpty && !isEmpty) {
    // A fresh search is starting — remember this spot.
    state.preSearchScroll[tabKey] = window.scrollY;
  } else if (!wasEmpty && isEmpty) {
    // Cleared back to empty — jump back, then forget it (next search starts fresh).
    const y = state.preSearchScroll[tabKey];
    delete state.preSearchScroll[tabKey];
    if (y != null) requestAnimationFrame(() => window.scrollTo(0, y));
  }
}

function filterOrderListRows() {
  const q = state.search.trim().toLowerCase();
  document.querySelectorAll('[data-order-row]').forEach((el) => {
    const match = !q || el.dataset.name.includes(q) || el.dataset.code.includes(q);
    el.classList.toggle('hidden', !match);
  });
}

function renderCartTab() {
  const cartGroups = computeCartGroups();

  if (state.cart.length === 0 && incomingOrders.length === 0) {

// Fast show/hide filter for the incoming orders list (same pattern as Stock
// and Runway) — keeps focus in the search box while typing. Also hides a date
// heading once all orders under it are filtered out.
function filterCartRows() {
  const q = state.cartSearch.trim().toLowerCase();
  let anyVisible = false;
  document.querySelectorAll('[data-cart-order]').forEach((el) => {
    const match = !q || (el.dataset.haystack || '').includes(q);
    el.classList.toggle('hidden', !match);
    if (match) anyVisible = true;
  });
  document.querySelectorAll('[data-cart-date-group]').forEach((group) => {
    const visible = group.querySelectorAll('[data-cart-order]:not(.hidden)').length;
    group.classList.toggle('hidden', visible === 0);
  });
  const noMatches = document.getElementById('cartNoMatches');
  if (noMatches) noMatches.classList.toggle('hidden', anyVisible || !q);
}

// Keeps the "Add all to cart" button in sync as quantities are typed. Updates
// the button in place rather than re-rendering the tab, so the keyboard and
// focus stay where they are. (Previously the button only recalculated on a
// full render, so it could sit greyed out even with quantities entered.)
function updateAddAllButton() {
  const btn = document.getElementById('addAllBtn');
  if (!btn) return;
  const count = Object.values(state.draftQty).filter((v) => parseFloat(v) > 0).length;
  const on = count > 0;
  btn.disabled = !on;
  btn.style.background = on ? 'var(--forest)' : 'var(--border)';
  btn.style.color = on ? '#fff' : 'var(--faint)';
  const label = document.getElementById('addAllLabel');
  if (label) label.textContent = `Add all${on ? ` (${count})` : ''} to cart`;
  const svg = btn.querySelector('svg');
  if (svg) svg.setAttribute('stroke', on ? '#fff' : 'var(--faint)');
}

// Jumps to whichever cart line is missing a pickup warehouse and flashes it,
// since the summary chip only shows a count, not which item it is.
function scrollToMissingPickup() {
  const missing = state.cart.find((c) =>
    !c.pickupWarehouseId || !state.warehouses.some((w) => w.id === c.pickupWarehouseId));
  if (!missing) return;
  const el = document.querySelector(`[data-cart-line="${missing.id}"]`);
  if (!el) return;
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  el.classList.remove('flash-highlight');
  void el.offsetWidth; // force reflow so the animation restarts if tapped again
  el.classList.add('flash-highlight');
}

function renderPickupLocationsSummary() {
  if (state.cart.length === 0) return '';
  const counts = {};
  state.cart.forEach((c) => {
    const found = c.pickupWarehouseId && state.warehouses.find((w) => w.id === c.pickupWarehouseId);
    const label = found ? found.name : 'Not set';
    counts[label] = (counts[label] || 0) + c.qty;
  });
  return `
    <section class="section">
      <div class="section-label">Pickup locations</div>
      <div class="row wrap gap2">
        ${Object.entries(counts).map(([name, count]) => {
          const style = `background:${name === 'Not set' ? 'var(--amber-bg)' : '#fff'};color:${name === 'Not set' ? 'var(--amber-text)' : 'var(--ink)'};border:1px solid ${name === 'Not set' ? 'var(--amber-border)' : 'var(--border)'};`;
          const inner = `${icon('mapPin', 12)} ${escapeHtml(name)} (${count})`;
          // "Not set" is tappable — jumps straight to the line missing it,
          // since the count alone doesn't say WHICH item that is.
          return name === 'Not set'
            ? `<button data-scroll-to-missing-pickup class="chip" style="${style}">${inner}</button>`
            : `<div class="chip" style="${style}">${inner}</div>`;
        }).join('')}
      </div>
    </section>`;
}

function renderSupplierCartCard(g) {
  const supplierDate = state.dateOverrides[g.supplier.id] || state.orderDate;
  const isOverridden = !!state.dateOverrides[g.supplier.id];
  return `
    <div class="card" data-supplier-card="${g.supplier.id}">
      <div class="row-between mb2">
        <span class="font-display" style="font-weight:600;color:var(--ink);">${escapeHtml(g.supplier.name)}</span>
        <button data-send-supplier="${g.supplier.id}" class="btn-sm btn-whatsapp" style="display:flex;align-items:center;gap:6px;">
          ${icon('send', 14, '#fff')} Send
        </button>
      </div>
