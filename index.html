/* Cart price: own on-screen number pad (digits + decimal point only), so
   the phone keyboard never pops up. */
function renderPricePad(p) {
  const line = p.itemId ? { itemId: p.itemId } : p.orderId ? orderLineAt(p.orderId, p.idx) : state.cart.find((c) => c.id === p.lineId);
  const item = line && state.items.find((i) => i.id === line.itemId);
  if (!line || !item) return '';
  const hint = displayCost(item);
  const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '.', '0', 'back'];
  return `
    <div class="popup-backdrop" data-popup-backdrop>
      <div class="popup-sheet">
        <div class="row-between mb2">
          <div class="flex1">
            <div class="text-sm truncate" style="font-weight:600;">${escapeHtml(item.name)}</div>
            <div class="text-xs muted">${p.itemId ? 'Quoted price' : 'Cost'} per unit${hint ? ` · ${hint.kind === 'avg' ? 'avg' : 'last'} ${fmtMoney(hint.price)}` : ''}</div>
          </div>
          <button data-close-popup class="modal-close">${icon('x', 18, 'var(--muted)')}</button>
        </div>
        <div class="pad-display" id="padDisplay">${p.value ? '$' + escapeHtml(p.value) : '<span class="faint">$0</span>'}</div>
        <div class="pad-grid">
          ${keys.map((k) => `<button data-pad-key="${k}">${k === 'back' ? '⌫' : k}</button>`).join('')}
        </div>
        <div class="row gap2" style="margin-top:12px;">
          <button data-pad-clear class="btn" style="background:var(--tint);color:var(--muted);width:auto;padding:10px 16px;">Clear</button>
          <button data-pad-save class="btn btn-primary flex1">Save</button>
        </div>
      </div>
    </div>`;
}

function pressPadKey(k) {
  const p = state.popup;
  let v = p.value || '';
  if (k === 'back') v = v.slice(0, -1);
  else if (k === '.') { if (!v.includes('.')) v = (v || '0') + '.'; }
  else {
    const dec = v.split('.')[1];
    if (dec != null && dec.length >= 2) return; // cents at most
    if (v === '0') v = k; else v += k;
    if (v.replace('.', '').length > 8) return;
  }
  p.value = v;
  const el = document.getElementById('padDisplay');
  if (el) el.innerHTML = v ? '$' + escapeHtml(v) : '<span class="faint">$0</span>';
}

// Quoted price typed on the Orders tab. Counts as the item's latest cost
// until a newer priced order is sent, and pre-fills the cart price.
function setItemQuote(itemId, price) {
  updateItems(state.items.map((it) => {
    if (it.id !== itemId) return it;
    if (price > 0) return { ...it, quote: { price, date: todayStr(), at: new Date().toISOString() } };
    const { quote, ...rest } = it;
    return rest;
  }));
}
// Price pre-filled when an item goes into the cart: the latest of a quote
// or the last price sent on an order (or the saved last cost).
function cartPrefillPrice(item) {
  const l = item ? latestCost(item) : null;
  return l && Number(l.price) > 0 ? Number(l.price) : 0;
}
function quotedPriceFor(item) {
  const l = item ? latestCost(item) : null;
  return l && l.quote ? l.price : 0;
}

function orderLineAt(orderId, idx) {
  const o = state.orders.find((x) => x.id === orderId);
  return o && o.items ? o.items[idx] : null;
}

// Price for a line on an order that's already been sent (e.g. supplier
// quoted after ordering). Also refreshes the item's saved latest cost if
// this is now its most recent priced order.
function setOrderLinePrice(orderId, idx, price) {
  const order = state.orders.find((o) => o.id === orderId);
  if (!order || !order.items[idx]) return;
  const itemId = order.items[idx].itemId;
  const oldPrice = Number(order.items[idx].price) || 0;
  updateOrders(state.orders.map((o) => {
    if (o.id !== orderId) return o;
    const items = o.items.map((l, i) => {
      if (i !== idx) return l;
      const next = { ...l };
      if (price > 0) next.price = price; else delete next.price;
      return next;
    });
    return { ...o, items };
  }));
  const newest = orderPurchasesForItem(itemId)[0];
  if (newest) {
    updateItems(state.items.map((it) => (it.id === itemId
      ? { ...it, lastCost: { price: newest.price, date: newest.date, supplierId: it.lastCost ? it.lastCost.supplierId : undefined } }
      : it)));
  } else if (oldPrice > 0) {
    // Price cleared and no other priced order left: drop the saved copy if it came from this line.
    updateItems(state.items.map((it) => (it.id === itemId && it.lastCost && Number(it.lastCost.price) === oldPrice
      ? (({ lastCost, ...rest }) => rest)(it)
      : it)));
  }
}

function setCartPrice(lineId, price) {
  updateCart(state.cart.map((c) => {
    if (c.id !== lineId) return c;
    const next = { ...c };
    if (price > 0) next.price = price; else delete next.price;
    return next;
  }));
}

function renderPurchaseDetails(p) {
  const item = state.items.find((i) => i.id === p.itemId);
  if (!item) return '';
  const rows = purchaseDetailsForItem(item);
  const unitStr = item.unit ? ' ' + escapeHtml(item.unit) : '';
  const body = rows.length
    ? `<table class="cost-table">
        <thead><tr><th>Date</th><th>From</th><th class="num">Qty</th><th class="num">Cost</th></tr></thead>
        <tbody>${rows.map((r) => `
          <tr>
            <td style="white-space:nowrap;">${shortDate(r.date)}</td>
            <td>${escapeHtml(r.source)}${r.kind === 'stock' ? ' <span class="tag" style="background:var(--green);color:var(--forest);">In stock</span>' : ''}</td>
            <td class="num">${r.qty}${unitStr}</td>
            <td class="num">${r.price != null ? fmtMoney(r.price) : '<span class="faint">—</span>'}${r.rentMonths ? `<div style="font-size:10px;color:var(--amber-strong);">incl. +${fmtMoney(r.rentMonths * RENT_PER_MONTH)} rent</div>` : ''}</td>
          </tr>`).join('')}</tbody>
      </table>
      <p class="hint" style="margin-top:10px;">Latest 10. Orders show the price typed in the cart when sent. "In stock" rows are landed shipments from Runway: quantity not yet drawn down by orders, and cost including $0.50 per month past rent-free.</p>`
    : `<p class="text-sm muted" style="padding:12px 0;">No purchase prices yet. Tap an item's name in the Cart to enter its price before sending.</p>`;
  return `
    <div class="popup-backdrop" data-popup-backdrop>
      <div class="popup-sheet">
        <div class="row-between mb2">
          <div class="flex1">
            <div class="text-sm" style="font-weight:600;">Purchase details</div>
            <div class="text-xs muted truncate">${escapeHtml(item.name)}</div>
          </div>
          <button data-close-popup class="modal-close">${icon('x', 18, 'var(--muted)')}</button>
        </div>
        ${body}
      </div>
    </div>`;
}

function onPopupClick(e) {
  const p = state.popup;
  if (!p) return;
  if (e.target.hasAttribute && e.target.hasAttribute('data-popup-backdrop')) { closePopup(); return; }
  const btn = e.target.closest('button');
  if (!btn) return;
  if (btn.hasAttribute('data-close-popup')) { closePopup(); return; }
  if (handleQuotePopupClick(btn, p)) return;
  if (btn.dataset.padKey) { pressPadKey(btn.dataset.padKey); return; }
  if (btn.hasAttribute('data-pad-clear')) { p.value = ''; pressPadKey('back'); return; }
  if (btn.hasAttribute('data-pad-save')) {
    if (p.itemId) setItemQuote(p.itemId, parseFloat(p.value) || 0);
    else if (p.orderId) setOrderLinePrice(p.orderId, p.idx, parseFloat(p.value) || 0);
    else setCartPrice(p.lineId, parseFloat(p.value) || 0);
    closePopup();
    renderTab();
  }
}

/* ============================================================
   OPEN-MODAL HELPERS — set up the initial draft object for each form
   ============================================================ */
function openItemModal(mode, item, insertAfterId) {
  const draft = item ? {
    name: item.name, itemCode: item.itemCode || '', supplierId: item.supplierId,
    unit: item.unit || '件', par: item.par ?? 0, stock: item.stock ?? 0,
    varyByDay: !!(item.parByDay && Object.keys(item.parByDay).length),
    parByDay: item.parByDay || {}, tagsText: (item.tags || []).join(', '),
    defaultWarehouseId: item.defaultWarehouseId || '', inactive: !!item.inactive,
    keySku: !!item.keySku, dailyBurn: item.dailyBurn ?? 0,
  } : {
    name: '', itemCode: '', supplierId: (state.suppliers[0] && state.suppliers[0].id) || '',
    unit: '件', par: 0, stock: 0, varyByDay: false, parByDay: {}, tagsText: '', defaultWarehouseId: '', inactive: false,
    keySku: false, dailyBurn: 0,
  };
  openModal({ type: 'item', mode, data: item, insertAfterId: insertAfterId || null, draft });
}

function openSupplierModal(mode, supplier) {
  const draft = supplier ? {
    name: supplier.name, whatsapp: supplier.whatsapp || '',
    defaultWarehouseId: supplier.defaultWarehouseId || '', isInternalAccount: !!supplier.isInternalAccount,
    isInternalSupplier: !!supplier.isInternalSupplier,
  } : { name: '', whatsapp: '', defaultWarehouseId: '', isInternalAccount: false, isInternalSupplier: false };
  openModal({ type: 'supplier', mode, data: supplier, draft });
}

function openWarehouseModal(mode, warehouse) {
  const draft = warehouse ? { name: warehouse.name } : { name: '' };
  openModal({ type: 'warehouse', mode, data: warehouse, draft });
}

/* Re-reads visible form inputs into the draft object, then re-renders the modal.
   Used when a change needs to alter the form's shape (e.g. toggling "vary by day"). */
function refreshItemDraftFromDom() {
  const d = state.modal.draft;
  d.name = document.getElementById('f_name').value;
  d.itemCode = document.getElementById('f_itemCode').value;
  d.supplierId = document.getElementById('f_supplierId').value;
  d.defaultWarehouseId = document.getElementById('f_defaultWarehouseId').value;
  d.unit = document.getElementById('f_unit').value;
  d.par = parseFloat(document.getElementById('f_par').value) || 0;
  d.stock = parseFloat(document.getElementById('f_stock').value) || 0;
  d.tagsText = document.getElementById('f_tagsText').value;
  d.varyByDay = document.getElementById('f_varyByDay').checked;
  const inactiveEl = document.getElementById('f_inactive');
  if (inactiveEl) d.inactive = inactiveEl.checked;
  const keySkuEl = document.getElementById('f_keySku');
  if (keySkuEl) d.keySku = keySkuEl.checked;
  const dailyBurnEl = document.getElementById('f_dailyBurn');
  if (dailyBurnEl) d.dailyBurn = parseFloat(dailyBurnEl.value) || 0;
  if (d.varyByDay) {
    WEEKDAYS.forEach((_, idx) => {
      const el = document.querySelector(`[data-day-par="${idx}"]`);
      if (el) d.parByDay[idx] = el.value === '' ? '' : (parseFloat(el.value) || 0);
    });
  }
}

/* ============================================================
   EVENT DELEGATION — bound once to stable containers, survives re-renders
   ============================================================ */
function initEventListeners() {
  const main = document.getElementById('mainContent');
  const toolbar = document.getElementById('tabToolbar');
  const modalRoot = document.getElementById('modalRoot');

  main.addEventListener('click', onMainClick);
  main.addEventListener('input', onMainInput);
  main.addEventListener('change', onMainChange);
  // Toolbar is a sibling of #mainContent (lives in the sticky header), so it
  // needs its own copies of the same delegated handlers — the handlers
  // themselves are dumb (just read e.target), so this is safe to share.
  toolbar.addEventListener('click', onMainClick);
  toolbar.addEventListener('input', onMainInput);
  toolbar.addEventListener('change', onMainChange);
  const headerRight = document.getElementById('headerRight');
  headerRight.addEventListener('change', onMainChange);
  headerRight.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b && state.tab === 'quote') handleQuoteMainClick(b); });
  modalRoot.addEventListener('click', onModalClick);
  modalRoot.addEventListener('input', onModalInput);
  modalRoot.addEventListener('change', onModalChange);
  document.getElementById('popupRoot').addEventListener('click', onPopupClick);
  document.getElementById('popupRoot').addEventListener('input', onPopupInput);
  document.getElementById('popupRoot').addEventListener('change', onPopupChange);
}
// renderTab()/renderModal() call these as no-ops now that listeners are global; kept for clarity at call sites.
function wireTabEvents() {}
function wireModalEvents() {}

function onMainClick(e) {
  const t = e.target;
  if (t.id === 'clearFiltersBtn') { state.filterValue = ''; state.search = ''; state.onlyOrderedForDate = false; renderTab(); return; }
  const btn = t.closest('button');
  if (!btn) return;
  if (handleQuoteMainClick(btn)) return;

  if (btn.dataset.addToCart) { addToCart(btn.dataset.addToCart, parseFloat(document.querySelector(`[data-draft-qty="${btn.dataset.addToCart}"]`).value) || 0); renderTab(); return; }
  if (btn.hasAttribute('data-add-all')) { addAllToCart(); renderTab(); return; }
  if (btn.dataset.moveItem) { const [id, dir] = btn.dataset.moveItem.split(':'); moveItem(id, dir); return; }
  if (btn.dataset.editItem) { openItemModal('edit', state.items.find((i) => i.id === btn.dataset.editItem)); return; }
  if (btn.dataset.insertItem) { openItemModal('new', null, btn.dataset.insertItem); return; }
  if (btn.hasAttribute('data-open-item-modal')) { openItemModal('new', null); return; }
  if (btn.dataset.runwayRisk) { state.runwayRisk = btn.dataset.runwayRisk; renderTab(); return; }
  if (btn.hasAttribute('data-runway-clear-filters')) { state.runwayRisk = 'all'; state.runwayMonth = 'all'; renderTab(); return; }
  if (btn.dataset.openRunwayDetail) { openModal({ type: 'runwayDetail', itemId: btn.dataset.openRunwayDetail }); return; }

  if (btn.dataset.sendSupplier) {
    const group = computeCartGroups().find((g) => g.supplier.id === btn.dataset.sendSupplier);
    if (group) sendSupplierOrder(group, state.dateOverrides[btn.dataset.sendSupplier] || state.orderDate);
    return;
  }
  if (btn.dataset.qtyStep) {
    const [lineId, delta] = btn.dataset.qtyStep.split(':');
    const line = state.cart.find((c) => c.id === lineId);
    if (line) setCartQty(lineId, Math.max(0, Math.round((line.qty + parseFloat(delta)) * 10) / 10));
    renderTab();
    return;
  }
  if (btn.dataset.fillSuggest) {
    const [itemId, qty] = btn.dataset.fillSuggest.split(':');
    state.draftQty[itemId] = qty;
    const input = document.querySelector(`[data-draft-qty="${itemId}"]`);
    if (input) input.value = qty;
    updateAddAllButton();
    return;
  }
  if (btn.dataset.quoteItem) {
    const it = state.items.find((i) => i.id === btn.dataset.quoteItem);
    const q = it && it.quote && Number(it.quote.price) > 0 ? String(it.quote.price) : '';
    if (it) openPopup({ type: 'pricePad', itemId: it.id, value: q });
    return;
  }
  if (btn.dataset.editOrderPrice) {
    const [orderId, idxStr] = btn.dataset.editOrderPrice.split(':');
    const idx = Number(idxStr);
    const line = orderLineAt(orderId, idx);
    if (line) openPopup({ type: 'pricePad', orderId, idx, value: Number(line.price) > 0 ? String(line.price) : '' });
    return;
  }
  if (btn.dataset.editCartPrice) {
    const line = state.cart.find((c) => c.id === btn.dataset.editCartPrice);
    if (line) openPopup({ type: 'pricePad', lineId: line.id, value: Number(line.price) > 0 ? String(line.price) : '' });
    return;
  }
  if (btn.dataset.toggleWarehouse) { toggleCartWarehouse(btn.dataset.toggleWarehouse); renderTab(); return; }
  if (btn.hasAttribute('data-scroll-to-missing-pickup')) { scrollToMissingPickup(); return; }
  if (btn.dataset.editPickup) { state.editingPickupFor = state.editingPickupFor === btn.dataset.editPickup ? null : btn.dataset.editPickup; state.editingSupplierFor = null; renderTab(); return; }
  if (btn.dataset.editSupplier) { state.editingSupplierFor = state.editingSupplierFor === btn.dataset.editSupplier ? null : btn.dataset.editSupplier; state.editingPickupFor = null; renderTab(); return; }
  if (btn.dataset.removeLine) { setCartQty(btn.dataset.removeLine, 0); renderTab(); return; }
  if (btn.dataset.undoOrder) { cancelOrder(state.orders.find((o) => o.id === btn.dataset.undoOrder)); return; }
  if (btn.dataset.reviseOrder) { state.revisingOrderId = state.revisingOrderId === btn.dataset.reviseOrder ? null : btn.dataset.reviseOrder; renderTab(); return; }
  if (btn.dataset.orderQtyStep) {
    const [orderId, idxStr, delta] = btn.dataset.orderQtyStep.split(':');
    const order = state.orders.find((o) => o.id === orderId);
    const idx = parseInt(idxStr, 10);
    if (order && order.items[idx]) {
      const newQty = Math.max(0, Math.round((order.items[idx].qty + parseFloat(delta)) * 10) / 10);
      setOrderLineQty(orderId, idx, newQty);
    }
    renderTab();
    return;
  }
  if (btn.dataset.removeOrderLine) {
    const [orderId, idxStr] = btn.dataset.removeOrderLine.split(':');
    removeOrderLine(orderId, parseInt(idxStr, 10));
    renderTab();
    return;
  }
  if (btn.dataset.incomingMode) { state.incomingCumulative = btn.dataset.incomingMode === 'through'; renderTab(); return; }

  if (btn.hasAttribute('data-open-supplier-modal')) { openSupplierModal('new', null); return; }
  if (btn.dataset.editSupplierModal) { openSupplierModal('edit', state.suppliers.find((s) => s.id === btn.dataset.editSupplierModal)); return; }
  if (btn.hasAttribute('data-open-import')) {
    if (confirm(`Importing will replace your current suppliers, stock items, warehouses, cart and pending orders with whatever is in the chosen file. This can't be undone. Continue?`)) {
      document.getElementById('importFileInput').click();
    }
    return;
  }
  if (btn.hasAttribute('data-export-data')) { exportDataToFile(); return; }
  if (btn.hasAttribute('data-toggle-suppliers')) { state.showSuppliers = !state.showSuppliers; renderTab(); return; }
  if (btn.hasAttribute('data-toggle-backup')) { state.showBackup = !state.showBackup; renderTab(); return; }
  if (btn.hasAttribute('data-toggle-warehouses')) { state.showWarehouses = !state.showWarehouses; renderTab(); return; }
  if (btn.hasAttribute('data-open-warehouse-modal')) { openWarehouseModal('new', null); return; }
  if (btn.dataset.editWarehouseModal) { openWarehouseModal('edit', state.warehouses.find((w) => w.id === btn.dataset.editWarehouseModal)); return; }
  if (btn.hasAttribute('data-open-driver-modal')) { openModal({ type: 'driver' }); return; }
}

function onMainInput(e) {
  const t = e.target;
  if (handleQuoteMainInput(t)) return;
  if (t.dataset && t.dataset.draftQty) {
    state.draftQty[t.dataset.draftQty] = t.value;
    updateAddAllButton(); // keep the button live as you type — no re-render, so focus stays put
    return;
  }
  if (t.id === 'orderSearch') { trackSearchScroll('today', state.search, t.value); state.search = t.value; filterOrderListRows(); return; }
  if (t.id === 'stockSearch') { trackSearchScroll('stock', state.stockSearch, t.value); state.stockSearch = t.value; filterStockRows(); return; }
  if (t.id === 'runwaySearch') { trackSearchScroll('runway', state.runwaySearch, t.value); state.runwaySearch = t.value; filterRunwayRows(); return; }
  if (t.id === 'cartSearch') { trackSearchScroll('cart', state.cartSearch, t.value); state.cartSearch = t.value; filterCartRows(); return; }
}

function onMainChange(e) {
  const t = e.target;
  if (handleQuoteMainChange(t)) return;
  if (t.id === 'importFileInput') {
    const file = t.files && t.files[0];
    importDataFromFile(file);
    t.value = '';
    return;
  }
  if (t.id === 'orderDateInput') {
    if (t.value && t.value >= todayStr()) { state.orderDate = t.value; renderTab(); }
    return;
  }
  if (t.id === 'runwayMonth') { state.runwayMonth = t.value; renderTab(); return; }
  if (t.id === 'filterFieldSelect') { state.filterField = t.value; state.filterValue = ''; renderTab(); return; }
  if (t.id === 'filterValueSelect') { state.filterValue = t.value; renderTab(); return; }
  if (t.id === 'onlyOrderedCheckbox') { state.onlyOrderedForDate = t.checked; renderTab(); return; }
  if (t.dataset && t.dataset.supplierDate) {
    const val = t.value;
    if (!val || val < todayStr()) return;
    if (val === state.orderDate) delete state.dateOverrides[t.dataset.supplierDate];
    else state.dateOverrides[t.dataset.supplierDate] = val;
    renderTab();
    return;
  }
  if (t.dataset && t.dataset.setPickup) { setCartPickupWarehouse(t.dataset.setPickup, t.value); state.editingPickupFor = null; renderTab(); return; }
  if (t.dataset && t.dataset.setOrderPickup) {
    const [orderId, idxStr] = t.dataset.setOrderPickup.split(':');
    setOrderLinePickupWarehouse(orderId, parseInt(idxStr, 10), t.value);
    renderTab();
    return;
  }
  if (t.dataset && t.dataset.setSupplier) { setCartSupplierOverride(t.dataset.setSupplier, t.value); state.editingSupplierFor = null; renderTab(); return; }
  if (t.id === 'incomingFilterDateSelect') { state.incomingFilterDate = t.value; renderTab(); return; }
  if (t.dataset && t.dataset.selectWarehouse) {
    const id = t.dataset.selectWarehouse;
    if (t.checked) state.selectedWarehousesForDriverMsg.push(id);
    else state.selectedWarehousesForDriverMsg = state.selectedWarehousesForDriverMsg.filter((x) => x !== id);
    renderTab();
    return;
  }
}


function onModalClick(e) {
  const t = e.target;
  const btn = t.closest('button');
  if (btn && btn.hasAttribute('data-close-modal')) { closeModal(); return; }
  if (btn && handleQuoteModalClick(btn)) return;

  if (btn && btn.hasAttribute('data-save-item')) {
    refreshItemDraftFromDom();
    const d = state.modal.draft;
    if (!d.name.trim() || !d.supplierId) return;
    const cleanParByDay = d.varyByDay
      ? Object.fromEntries(Object.entries(d.parByDay).filter(([, v]) => v !== '' && v != null))
      : {};
    const tags = d.tagsText.split(',').map((s) => s.trim()).filter(Boolean);
    saveItem({
      id: state.modal.data ? state.modal.data.id : undefined,
      name: d.name.trim(), itemCode: d.itemCode.trim(), supplierId: d.supplierId,
      unit: d.unit.trim(), par: d.par, stock: d.stock, parByDay: cleanParByDay, tags,
      defaultWarehouseId: d.defaultWarehouseId, inactive: !!d.inactive, insertAfterId: state.modal.insertAfterId,
      keySku: !!d.keySku, dailyBurn: d.dailyBurn || 0,
    });
    return;
  }
  if (btn && btn.dataset.deleteItem) { deleteItem(btn.dataset.deleteItem); return; }
  if (btn && btn.dataset.openPurchases) { openPopup({ type: 'purchases', itemId: btn.dataset.openPurchases }); return; }

  if (btn && btn.hasAttribute('data-save-supplier')) {
    const d = state.modal.draft;
    if (!d.name.trim()) return;
    saveSupplier({
      id: state.modal.data ? state.modal.data.id : undefined,
      name: d.name.trim(), whatsapp: d.whatsapp.trim(),
      defaultWarehouseId: d.defaultWarehouseId, isInternalAccount: d.isInternalAccount,
      isInternalSupplier: !!d.isInternalSupplier,
    });
    return;
  }
  if (btn && btn.dataset.deleteSupplier) {
    const supplier = state.suppliers.find((s) => s.id === btn.dataset.deleteSupplier);
    const hasItems = supplier && state.items.some((i) => i.supplierId === supplier.id);
    if (!hasItems) deleteSupplier(btn.dataset.deleteSupplier);
    return;
  }

  if (btn && btn.hasAttribute('data-save-warehouse')) {
    const d = state.modal.draft;
    if (!d.name.trim()) return;
    saveWarehouse({ id: state.modal.data ? state.modal.data.id : undefined, name: d.name.trim() });
    return;
  }
  if (btn && btn.dataset.deleteWarehouse) { deleteWarehouse(btn.dataset.deleteWarehouse); return; }

  if (btn && btn.hasAttribute('data-send-driver-message')) {
    const msg = buildDriverMessage();
    sendOrShareMessage('', msg).then(() => {
      const statusEl = document.getElementById('driverSendStatus');
      if (statusEl) statusEl.textContent = 'Opened WhatsApp — pick your driver(s) or group.';
    });
    return;
  }

  if (btn && btn.hasAttribute('data-save-shipment')) {
    const d = state.modal.draft;
    if (!(Number(d.quantity) > 0)) return;
    const next = {
      id: state.modal.data ? state.modal.data.id : undefined,
      itemId: d.itemId, header: (d.header || '').trim(), supplierId: d.supplierId || '',
      askingPrice: d.askingPrice === '' ? null : Number(d.askingPrice) || 0,
      quantity: Number(d.quantity) || 0,
      etaDate: d.etaDate, rentFreeDeadline: d.rentFreeDeadline, received: !!d.received,
      notes: (d.notes || '').trim(),
      drawnDown: Number(d.drawnDown) || 0,
    };
    // Keep the finished flag consistent with the numbers after a manual edit.
    // Explicit null (not omission) so the merge in saveShipment clears it.
    next.finishedAt = shipmentRemaining(next) <= 0
      ? ((state.modal.data && state.modal.data.finishedAt) || todayStr())
      : null;
    saveShipment(next);
    return;
  }
  if (btn && btn.dataset.deleteShipment) { deleteShipment(btn.dataset.deleteShipment); return; }
  if (btn && btn.dataset.addShipment) {
    const itemId = btn.dataset.addShipment;
    openShipmentModal('new', null, itemId, { type: 'runwayDetail', itemId });
    return;
  }
  if (btn && btn.dataset.editShipment) {
    const shipment = state.shipments.find((s) => s.id === btn.dataset.editShipment);
    if (shipment) openShipmentModal('edit', shipment, shipment.itemId, { type: 'runwayDetail', itemId: shipment.itemId });
    return;
  }
  if (btn && btn.dataset.toggleReceived) {
    const s = state.shipments.find((x) => x.id === btn.dataset.toggleReceived);
    if (s) {
      updateShipments(state.shipments.map((x) => (x.id === s.id
        ? { ...x, received: !x.received, receivedDate: !x.received ? todayStr() : null }
        : x)));
      renderModal(); // stay on the same detail view, just refresh it
    }
    return;
  }
}

function onModalInput(e) {
  const t = e.target;
  if (t.id && t.id.startsWith('f_') && state.modal) {
    // Keep the draft roughly in sync as the user types (cheap; avoids losing text on unrelated re-renders).
    const d = state.modal.draft;
    const key = t.id.slice(2);
    if (key in d) d[key] = t.type === 'checkbox' ? t.checked : t.value;
    // Shipment form: ETA drives a default rent-free deadline, unless the
    // deadline has been set by hand (i.e. it no longer matches the last default).
    if (key === 'etaDate' && state.modal.type === 'shipment') {
      const next = defaultRentFreeDeadline(d.etaDate);
      if (!d.rentFreeDeadline || d.rentFreeDeadline === d.rfAuto) {
        d.rentFreeDeadline = next;
        const rfEl = document.getElementById('f_rentFreeDeadline');
        if (rfEl) rfEl.value = next;
      }
      d.rfAuto = next;
    }
    updateSaveButtonState();
  }
}

/* Directly toggles the Save button (and its hint text, for items) to match the current draft,
   without a full re-render — so the button un-greys the moment enough info is typed in. */
function updateSaveButtonState() {
  if (!state.modal) return;
  const d = state.modal.draft;
  const type = state.modal.type;
  const modalRoot = document.getElementById('modalRoot');
  let canSave = false;
  let selector = '';
  if (type === 'item') { canSave = !!(d.name && d.name.trim() && d.supplierId); selector = '[data-save-item]'; }
  else if (type === 'supplier') { canSave = !!(d.name && d.name.trim()); selector = '[data-save-supplier]'; }
  else if (type === 'warehouse') { canSave = !!(d.name && d.name.trim()); selector = '[data-save-warehouse]'; }
  else if (type === 'shipment') { canSave = !!(d && Number(d.quantity) > 0); selector = '[data-save-shipment]'; }
  else return;
  const btn = modalRoot.querySelector(selector);
  if (btn) btn.disabled = !canSave;
  if (type === 'item') {
    const hint = modalRoot.querySelector('.warn-hint');
    if (hint) {
      hint.style.display = canSave ? 'none' : '';
      if (!canSave) hint.textContent = (!d.name || !d.name.trim()) ? 'Enter an item name to save.' : 'Choose a supplier to save.';
    }
  }
}

function onModalChange(e) {
  const t = e.target;
  if (!state.modal) return;
  if (t.id === 'f_varyByDay') { refreshItemDraftFromDom(); renderModal(); return; }
  if (t.id === 'f_keySku' && state.modal.type === 'item') { refreshItemDraftFromDom(); renderModal(); return; }
  if (t.id === 'f_supplierId' && state.modal.type === 'item') { refreshItemDraftFromDom(); renderModal(); return; }
  if (t.dataset && t.dataset.dailyBurnFor) {
    const id = t.dataset.dailyBurnFor;
    const val = parseFloat(t.value) || 0;
    updateItems(state.items.map((i) => (i.id === id ? { ...i, dailyBurn: val } : i)));
    renderModal(); // refresh the projection with the new rate, stay on this view
    return;
  }
  if (t.dataset && t.dataset.stockAvailableFor) {
    const id = t.dataset.stockAvailableFor;
    const val = parseFloat(t.value) || 0;
    updateItems(state.items.map((i) => (i.id === id ? { ...i, stockAvailable: val } : i)));
    renderModal(); // refresh alerts/chart/runway using the new figure, stay on this detail view
    return;
  }
}

/* ============================================================
   QUOTE TAB — client price list
   - Every active stock item gets its own quote line automatically. Lines can
     group several stock items (priced from the most expensive one); a stock
     item belongs to one line only. Lines with no stock item ("manual") are
     for added-value goods that aren't in the stock list.
   - Cost per stock unit = the Orders page cost (displayCost). × factor turns
     it into cost per sale unit. Price = cost ÷ (1 − margin), capped at
     cost + max $ profit, rounded UP to the next 10¢.
   - baseCost is the cost per stock unit when the line was last saved. The
     price is worked out from it, so it doesn't move by itself; the ↑/↓ arrow
     shows when today's cost differs. Saving the line takes today's cost.
   - Company details live only in this phone's storage (never in the code).
   ============================================================ */
const QUOTE_UNITS = ['磅', '斤', 'kg', '包', '隻', '盒', '餅', '箱', '件'];
const QUOTE_UNIT_EN = { '磅': 'lb', '斤': 'catty', 'kg': 'kg', '包': 'pack', '隻': 'pc', '盒': 'box', '餅': 'block', '箱': 'carton', '件': 'pc' };

// Categories and cuts start empty: they're typed in on the phone (Setup tab),
// so nothing about the business is kept in the code.
function defaultQuoteCats() { return []; }
function defaultQuoteCuts() { return []; }
function ensureQuoteDefaults() {
  if (!Array.isArray(state.quoteCats)) { state.quoteCats = defaultQuoteCats(); persist('quoteCats'); }
  if (!Array.isArray(state.quoteCuts)) { state.quoteCuts = defaultQuoteCuts(); persist('quoteCuts'); }
  if (!state.company || typeof state.company !== 'object') state.company = {};
}

function updateQuoteLines(next) { state.quoteLines = next; persist('quoteLines'); }

/* ---------- maths ---------- */
/* Expected rent (Quote tab only, when the "+Rent" chip is on).
   For each LANDED batch with a price, the runway simulation (burn rate,
   pending pickups, earliest rent-free deadline drawn first) estimates how
   much of it is still in the warehouse at the start of each rent month.
   Every unit still there pays +$0.50 for that month, as in batchCost():
   1 day over = month 1, one month and a day over = month 2, and so on.
   Months already passed count for every unit (as on the Orders page).
   Future rent months are only looked at up to 12 months from TODAY, so a
   slow burn rate can't stretch the estimate indefinitely.
   Without a burn rate there's nothing to project from, so such a batch only
   gets the rent already due (same as the Orders page). */
const QUOTE_RENT_MAX_MONTHS = 12;
function rentMonthMark(deadline, k) {
  const [y, m, d] = deadline.split('-').map(Number);
  const last = new Date(y, m - 1 + k + 1, 0).getDate();
  return toLocalDateStr(new Date(y, m - 1 + k, Math.min(d, last)));
}
let qRentCache = {};
function projectedAvgCost(item) {
  if (!item) return null;
  if (qRentCache[item.id] !== undefined) return qRentCache[item.id];
  const landed = state.shipments.filter((s) => s.itemId === item.id && s.received && batchCost(s) && shipmentRemaining(s) > 0);
  if (!landed.length) return (qRentCache[item.id] = null);
  const burn = effectiveBurn(item);
  const limitDay = daysFromToday(rentMonthMark(todayStr(), QUOTE_RENT_MAX_MONTHS)); // 12 months from today
  const sim = burn > 0 ? simulateItemRunway(item, state.shipments, limitDay) : null;
  let qty = 0, total = 0, rentTotal = 0;
  landed.forEach((s) => {
    const base = Number(s.askingPrice);
    const q = shipmentRemaining(s);
    let rent = 0; // total rent $ for this batch's q units
    if (s.rentFreeDeadline) {
      const b = sim ? sim.batches.find((x) => x.id === s.id) : null;
      for (let k = 1; k <= 600; k++) {
        const day = daysFromToday(rentMonthMark(s.rentFreeDeadline, k - 1)) + 1; // first day of rent month k
        if (day > limitDay) break;                     // beyond 12 months from today
        let units;
        if (day <= 0) units = q;                       // already being charged
        else if (!b) units = 0;                        // no burn rate: can't project
        else units = Math.min(q, b.perDay[Math.min(day, b.perDay.length - 1)] || 0);
        if (units <= 0 && day > 0) break;
        rent += units * RENT_PER_MONTH;
      }
    }
    qty += q; total += q * base + rent; rentTotal += rent;
  });
  return (qRentCache[item.id] = qty > 0 ? { avg: total / qty, rent: rentTotal / qty, qty, noBurn: !(burn > 0) } : null);
}
// Cost per stock unit for the Quote tab: the Orders page cost, or (with
// "+Rent" on and an average-based cost) the average including expected rent.
function qItemCostInfo(item) {
  const c = item ? displayCost(item) : null;
  if (!c || !(Number(c.price) > 0)) return null;
  if (state.quoteRent && c.kind === 'avg') {
    const p = projectedAvgCost(item);
    if (p) {
      const nowAvg = weightedAvgCost(item);
      const already = nowAvg ? nowAvg.avg - (p.avg - p.rent) : 0; // rent already in the Orders page figure
      return { cost: p.avg, rent: p.rent, extra: p.avg - Number(c.price), already, noBurn: p.noBurn };
    }
  }
  return { cost: Number(c.price), rent: 0, extra: 0, already: 0, noBurn: false };
}
function qItemCost(item) {
  const c = qItemCostInfo(item);
  return c ? c.cost : null;
}
// Highest cost among the line's stock items (per stock unit), or the manual cost.
function qRawCost(itemIds, manualCost) {
  let best = null, bestItem = null;
  (itemIds || []).forEach((id) => {
    const it = state.items.find((i) => i.id === id);
    const c = qItemCost(it);
    if (c != null && (best == null || c > best)) { best = c; bestItem = it; }
  });
  if (best == null && Number(manualCost) > 0) return { cost: Number(manualCost), item: null };
  return best == null ? null : { cost: best, item: bestItem, info: qItemCostInfo(bestItem) };
}
function qFactor(f) { const n = Number(f); return n > 0 ? n : 1; }
function qRoundUp10(x) { return Math.ceil(Math.round(x * 1000) / 100 - 1e-9) / 10; }
function qCapValue(cap) { return cap === '' || cap == null || !(Number(cap) >= 0) ? null : Number(cap); }
function qPrice(costPerSaleUnit, margin, cap) {
  if (!(costPerSaleUnit > 0)) return null;

  let p = costPerSaleUnit / (1 - m);
  const c = qCapValue(cap);
  const capped = c != null && costPerSaleUnit + c < p;
  if (capped) p = costPerSaleUnit + c;
  return { price: qRoundUp10(p), beforeCap: costPerSaleUnit / (1 - m), capped };
}
function qLineInfo(line) {

  const hasBase = Number(line.baseCost) > 0 && raw && raw.item;
  const base = hasBase ? Number(line.baseCost) * f : cur;
  const pr = base != null ? qPrice(base, line.margin, line.cap) : null;
  let trend = '';
  if (hasBase) {
    // Compare the figures as shown (per sale unit, to the cent), so an arrow
    // never appears between two identical-looking numbers.
    const d = Math.round(cur * 100) - Math.round(base * 100);
    if (d > 0) trend = 'up'; else if (d < 0) trend = 'down';
  }
  const price = pr ? pr.price : null;
  const margin = price && cur != null ? (price - cur) / price * 100 : null;
  return { raw, cur, base, price, trend, margin, oldCost: hasBase ? base : null };
}
function qMoney(n) { return (Math.round(n * 100) / 100).toFixed(2); }

/* ---------- keep lines in step with the stock list ---------- */
function syncQuoteLines() {
  const itemIds = new Set(state.items.map((i) => i.id));
  const claimed = new Set();
  let changed = false;
  let lines = (state.quoteLines || []).map((l) => {
    const before = l.itemIds || [];
    const ids = before.filter((id) => itemIds.has(id) && !claimed.has(id));
    ids.forEach((id) => claimed.add(id));
    if (ids.length !== before.length) { changed = true; return { ...l, itemIds: ids }; }
    return l;
  });
  lines = lines.filter((l) => {
    if (l.itemIds.length === 0 && !l.manual) { changed = true; return false; }
    return true;
  });
  state.items.forEach((it) => {
    if (claimed.has(it.id) || it.inactive) return;
    lines.push({ id: uid(), name: it.name, nameEn: '', catId: '', unit: '', factor: 1, itemIds: [it.id], margin: 15, cap: null, baseCost: null, cuts: [], selected: false });
    changed = true;
  });
  // First time a line has a cost, remember it as the starting point for the arrow.
  lines = lines.map((l) => {
    if (Number(l.baseCost) > 0) return l;
    const raw = qRawCost(l.itemIds, null);
    if (raw && raw.item) { changed = true; return { ...l, baseCost: raw.cost }; }
    return l;
  });
  if (changed) updateQuoteLines(lines);
}

function qCat(id) { return (state.quoteCats || []).find((c) => c.id === id) || null; }
function qCut(id) { return (state.quoteCuts || []).find((c) => c.id === id) || null; }
function qItemOrder(line) {
  let best = Infinity;

  return best;
}

  return [...lines].sort((a, b) => qItemOrder(a) - qItemOrder(b));
}

  return `${line.name || ''} ${line.nameEn || ''} ${codes}`.toLowerCase();

function qVisibleLines() {

    const f = state.quoteFilter;
    if (f === 'unselected' && l.selected) return false;
    if (f === 'unclassed' && qCat(l.catId)) return false;
    if (f === 'up' || f === 'down') { if (qLineInfo(l).trend !== f) return false; }
    if (state.quoteCatFilter === '_none' && qCat(l.catId)) return false;
    if (state.quoteCatFilter && state.quoteCatFilter !== '_none' && l.catId !== state.quoteCatFilter) return false;
    return true;
  });
}

/* ---------- PDF price list ---------- */
// Price-list data: one section per category; each group is a line plus its cuts
// (cut price = line price + add-on), kept together in one box.
function qPdfData(lang) {
  const en = lang === 'en';
  const nm = (x) => (en && x.nameEn && x.nameEn.trim() ? x.nameEn.trim() : x.name);
  const unitOf = (u) => (en ? (QUOTE_UNIT_EN[u] || u) : u);
  const lines = state.quoteLines.filter((l) => l.selected);
  const skipped = [];
  const cats = [...(state.quoteCats || []).map((c) => ({ cat: c, lines: lines.filter((l) => l.catId === c.id) })),
    { cat: { name: '未分類', nameEn: 'Other' }, lines: lines.filter((l) => !qCat(l.catId)) }];
  const sections = [];
  cats.forEach((s) => {
    const groups = [];
    qSortedLines(s.lines).forEach((l) => {
      const info = qLineInfo(l);
      if (info.price == null) { skipped.push(l.name); return; }
      const unit = unitOf(l.unit || '');
      const g = [{ name: nm(l), price: qMoney(info.price), unit, cut: false }];
      (l.cuts || []).forEach((c) => {
        const cut = qCut(c.cutId);
        if (!cut || !(Number(c.price) > 0)) return;
        g.push({ name: nm(cut), price: qMoney(info.price + Number(c.price)), unit, cut: true });
      });
      groups.push(g);
    });
    if (groups.length) sections.push({ title: nm(s.cat), groups });
  });
  return { sections, skipped };
}
const Q_PDF = { W: 1754, H: 1240, M: 60, rowH: 34, titleH: 42, headH: 32, top: 196, bottom: 1240 - 100, blockGap: 26 };
const Q_FONT = '-apple-system, "PingFang TC", "Heiti TC", "Noto Sans CJK TC", "Microsoft JhengHei", sans-serif';
// Split a section's groups into 3 side-by-side columns, top to bottom, never
// splitting a line from its cuts.
function qSplitCols(groups) {
  // Best split into 3 runs (kept in order) so the tallest column is as short
  // as possible; on ties, fill the left columns first.
  const pre = [0];
  groups.forEach((g) => pre.push(pre[pre.length - 1] + g.length));
  const n = groups.length, sum = (a, b) => pre[b] - pre[a];
  let best = null;
  for (let i = 0; i <= n; i++) {
    for (let j = i; j <= n; j++) {
      const h = [sum(0, i), sum(i, j), sum(j, n)];
      const key = [Math.max(...h), -h[0], -h[1]];
      if (!best || key[0] < best.key[0] || (key[0] === best.key[0] && (key[1] < best.key[1] || (key[1] === best.key[1] && key[2] < best.key[2])))) best = { key, i, j };
    }
  }
  return [groups.slice(0, best.i), groups.slice(best.i, best.j), groups.slice(best.j)];
}
function qColRows(col) { return col.reduce((n, g) => n + g.length, 0); }
// Lay sections out as tables down the page. A table that doesn't fit in the
// space left starts on the next page; one too big for a whole page is split.
function qLayoutBlocks(sections, lang) {
  const { rowH, titleH, headH, top, bottom, blockGap } = Q_PDF;
  const cont = lang === 'en' ? ' (cont.)' : ' (續)';
  const pageRows = Math.floor((bottom - top - titleH - headH) / rowH);
  const pages = [[]];
  let y = top;
  const place = (block) => {
    const h = titleH + headH + block.rows * rowH;
    if (y > top && y + h > bottom) { pages.push([]); y = top; }
    pages[pages.length - 1].push({ ...block, y });
    y += h + blockGap;
  };
  sections.forEach((s) => {
    const cols = qSplitCols(s.groups);
    const rows = Math.max(...cols.map(qColRows));
    if (rows <= pageRows) { place({ title: s.title, cols, rows }); return; }
    // Too tall for one page: cut into page-sized chunks (3 columns × pageRows).
    let chunk = [], used = [0, 0, 0], ci = 0, first = true;
    const flush = () => {
      let c = chunk; chunk = []; used = [0, 0, 0]; ci = 0;
      if (!c.some((x) => x.length)) return;
      // Spread this page's share evenly over the 3 columns (keep the packed
      // version only if spreading would overflow a column).
      const even = qSplitCols(c.flat());
      if (Math.max(...even.map(qColRows)) <= pageRows) c = even;
      place({ title: first ? s.title : s.title + cont, cols: c, rows: Math.max(...c.map(qColRows)) });
      first = false;
    };
    chunk = [[], [], []];
    s.groups.forEach((g) => {
      if (used[ci] + g.length > pageRows) { ci++; if (ci > 2) { flush(); chunk = [[], [], []]; } }
      chunk[ci].push(g); used[ci] += g.length;
    });
    flush();
  });
  return pages;
}
function qFit(ctx, text, maxW) {
  if (ctx.measureText(text).width <= maxW) return text;
  let t = text;
  while (t.length > 1 && ctx.measureText(t + '…').width > maxW) t = t.slice(0, -1);
  return t + '…';
}
function qLoadImage(src) {
  return new Promise((res) => { if (!src) { res(null); return; } const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; });
}
async function buildQuotePages(lang) {
  const en = lang === 'en';
  const { sections, skipped } = qPdfData(lang);
  const pages = qLayoutBlocks(sections, lang);
  const co = state.company || {};
  const logo = await qLoadImage(co.logo);
  const d = new Date();
  const dateStr = `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`;
  const { W, H, M, rowH, titleH, headH } = Q_PDF;
  const gap = 28;
  const colW = (W - 2 * M - 2 * gap) / 3;
  const out = pages.map((blocks, pi) => {
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const x = c.getContext('2d');
    x.fillStyle = '#fff'; x.fillRect(0, 0, W, H);
    x.fillStyle = '#111'; x.textBaseline = 'middle';
    // page header
    let hx = M;
    if (logo) {
      const h = 100, w = Math.min(320, logo.width * (h / logo.height));
      const hh = logo.height * (w / logo.width);
      x.drawImage(logo, M, 44 + (h - hh) / 2, w, hh);
      hx = M + w + 24;
    }
    const coName = en ? (co.nameEn || co.nameZh || '') : (co.nameZh || co.nameEn || '');
    if (coName) { x.font = `700 40px ${Q_FONT}`; x.textAlign = 'left'; x.fillText(qFit(x, coName, W - hx - 420), hx, 94); }
    x.textAlign = 'right';
    x.font = `700 44px ${Q_FONT}`; x.fillText(en ? 'Price List' : '報價單', W - M, 76);
    x.font = `400 24px ${Q_FONT}`; x.fillStyle = '#444'; x.fillText(dateStr, W - M, 120);
    x.fillStyle = '#111'; x.fillRect(M, 160, W - 2 * M, 3);
    // category tables
    blocks.forEach((b) => {
      let y = b.y;
      x.fillStyle = '#333'; x.fillRect(M, y, W - 2 * M, titleH);
      x.fillStyle = '#fff'; x.font = `700 24px ${Q_FONT}`; x.textAlign = 'left';
      x.fillText(qFit(x, b.title, W - 2 * M - 24), M + 12, y + titleH / 2 + 1);
      y += titleH;
      const usedCols = b.cols.filter((col) => col.length).length || 1;
      b.cols.forEach((col, ci) => {
        if (ci >= usedCols) return;
        const cx = M + ci * (colW + gap);
        const priceR = cx + colW - 78, unitL = cx + colW - 66;
        x.fillStyle = '#F2F2F2'; x.fillRect(cx, y, colW, headH);
        x.font = `600 19px ${Q_FONT}`; x.fillStyle = '#555';
        x.textAlign = 'left'; x.fillText(en ? 'Item' : '貨品', cx + 8, y + headH / 2);
        x.textAlign = 'right'; x.fillText(en ? 'Price' : '單價', priceR, y + headH / 2);
        x.textAlign = 'left'; x.fillText(en ? 'Unit' : '單位', unitL, y + headH / 2);
        let ry = y + headH;
        col.forEach((g) => {
          g.forEach((r) => {
            const ind = r.cut ? 26 : 0;
            x.fillStyle = r.cut ? '#444' : '#111';
            x.font = `${r.cut ? 400 : 500} ${r.cut ? 20 : 22}px ${Q_FONT}`; x.textAlign = 'left';
            x.fillText(qFit(x, (r.cut ? '└ ' : '') + r.name, priceR - cx - 100 - ind), cx + 8 + ind, ry + rowH / 2);
            x.font = `600 ${r.cut ? 20 : 22}px ${Q_FONT}`; x.textAlign = 'right'; x.fillText('$' + r.price, priceR, ry + rowH / 2);
            x.font = `400 20px ${Q_FONT}`; x.textAlign = 'left'; x.fillStyle = '#444'; x.fillText(r.unit, unitL, ry + rowH / 2);
            ry += rowH;
          });
          x.fillStyle = '#CFCFCF'; x.fillRect(cx, ry - 1, colW, 1.2); // one box per line + its cuts
        });
        // table outline down to the block's full height, so the 3 columns line up
        x.strokeStyle = '#999'; x.lineWidth = 1.5;
        x.strokeRect(cx + 0.5, y + 0.5, colW - 1, headH + b.rows * rowH - 1);
      });
    });
    // footer
    x.fillStyle = '#111'; x.fillRect(M, H - 80, W - 2 * M, 2);
    x.font = `400 20px ${Q_FONT}`; x.fillStyle = '#333';
    const left = [co.address, co.phone, co.contact].filter((s) => s && s.trim()).join('  ·  ');
    x.textAlign = 'left'; x.fillText(qFit(x, left, W * 0.55), M, H - 50);
    x.textAlign = 'center'; if (co.footer) x.fillText(qFit(x, co.footer, W * 0.25), W * 0.72, H - 50);
    x.textAlign = 'right'; x.fillText(`${pi + 1} / ${pages.length}`, W - M, H - 50);
    return c.toDataURL('image/jpeg', 0.9);
  });
  const rowCount = sections.reduce((n, s) => n + s.groups.reduce((m, g) => m + g.length, 0), 0);
  return { images: out, skipped, rowCount };
}
function qDataUrlBytes(url) {
  const b = atob(url.split(',')[1]);
  const a = new Uint8Array(b.length);
  for (let i = 0; i < b.length; i++) a[i] = b.charCodeAt(i);
  return a;
}
// Minimal PDF: one A4-landscape page per JPEG image.
function qJpegsToPdf(dataUrls, imgW, imgH) {
  const enc = new TextEncoder();
  const parts = [];
  let len = 0;
  const offsets = [];
  const push = (x) => { const b = typeof x === 'string' ? enc.encode(x) : x; parts.push(b); len += b.length; };
  const n = dataUrls.length;
  const pw = 841.89, ph = 595.28;
  push('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  const obj = (id, body) => { offsets[id] = len; push(`${id} 0 obj\n`); body(); push('\nendobj\n'); };
  const kids = [];
  for (let i = 0; i < n; i++) kids.push(`${3 + i * 3} 0 R`);
  obj(1, () => push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2, () => push(`<< /Type /Pages /Kids [${kids.join(' ')}] /Count ${n} >>`));
  dataUrls.forEach((u, i) => {
    const pid = 3 + i * 3, cid = pid + 1, iid = pid + 2;
    const img = qDataUrlBytes(u);
    const content = `q ${pw} 0 0 ${ph} 0 0 cm /Im0 Do Q`;
    obj(pid, () => push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pw} ${ph}] /Resources << /XObject << /Im0 ${iid} 0 R >> >> /Contents ${cid} 0 R >>`));
    obj(cid, () => push(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`));
    obj(iid, () => { push(`<< /Type /XObject /Subtype /Image /Width ${imgW} /Height ${imgH} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${img.length} >>\nstream\n`); push(img); push('\nendstream'); });
  });
  const total = 3 + n * 3;
  const xref = len;
  let x = `xref\n0 ${total}\n0000000000 65535 f \n`;
  for (let i = 1; i < total; i++) x += `${String(offsets[i]).padStart(10, '0')} 00000 n \n`;
  push(x);
  push(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  return new Blob(parts, { type: 'application/pdf' });
}

let quotePdfCache = null; // { lang, blob, name } — built when the preview opens, so Share is instant
function quotePdfName(lang) {
  const d = todayStr().replace(/-/g, '');
  return lang === 'en' ? `PriceList_${d}.pdf` : `報價單_${d}.pdf`;
}
function renderQuotePreviewModal() {
  const en = state.quoteLang === 'en';
  return modalShell('Price list', `
    <div class="row-between mb2">
      <div class="segmented">
        <button data-q-lang="zh" class="${en ? '' : 'active'}">中文</button>
        <button data-q-lang="en" class="${en ? 'active' : ''}">English</button>
      </div>
      <span class="text-xs muted" id="qPreviewInfo">Building…</span>
    </div>
    <div id="qPreviewWarn"></div>
    <div id="qPreviewPages" style="display:flex;flex-direction:column;gap:10px;"></div>
    <div style="height:70px;"></div>
    <div style="position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));max-width:608px;margin:0 auto;">
      <button data-q-share class="btn btn-whatsapp" disabled>${icon('send', 15, '#fff')} Share PDF (WhatsApp)</button>
    </div>`);
}
async function fillQuotePreview() {
  const lang = state.quoteLang === 'en' ? 'en' : 'zh';
  quotePdfCache = null;
  if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch (e) { /* ignore */ } }
  const res = await buildQuotePages(lang);
  if (!state.modal || state.modal.type !== 'quotePreview' || (state.quoteLang === 'en' ? 'en' : 'zh') !== lang) return;
  const blob = qJpegsToPdf(res.images, Q_PDF.W, Q_PDF.H);
  quotePdfCache = { lang, blob, name: quotePdfName(lang) };
  const pagesEl = document.getElementById('qPreviewPages');
  if (pagesEl) pagesEl.innerHTML = res.images.map((u) => `<img src="${u}" style="width:100%;border:1px solid var(--border);border-radius:6px;box-shadow:0 2px 6px rgba(0,0,0,.08);background:#fff;">`).join('');
  const info = document.getElementById('qPreviewInfo');
  if (info) info.textContent = `${res.rowCount} lines · ${res.images.length} page${res.images.length === 1 ? '' : 's'}`;
  const warn = document.getElementById('qPreviewWarn');
  if (warn) warn.innerHTML = res.skipped.length ? `<div class="card mb2" style="background:var(--amber-bg);border-color:var(--amber-border);"><div class="text-xs" style="color:var(--amber-text);">Left out (no cost yet): ${escapeHtml(res.skipped.join('、'))}</div></div>` : '';
  const btn = document.querySelector('[data-q-share]');
  if (btn) btn.disabled = false;
}
async function shareQuotePdf() {
  if (!quotePdfCache) return;
  const { blob, name } = quotePdfCache;
  const file = new File([blob], name, { type: 'application/pdf' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  showToast('PDF saved. Send it from Files to WhatsApp.');
}
function handleQuoteModalClick(btn) {
  if (!state.modal || state.modal.type !== 'quotePreview') return false;
  if (btn.dataset.qLang) {
    state.quoteLang = btn.dataset.qLang; persist('quoteLang');
    renderModal(); fillQuotePreview();
    return true;
  }
  if (btn.hasAttribute('data-q-share')) { shareQuotePdf(); return true; }
  return false;
}
